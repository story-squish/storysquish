  )];
}

// "80,000" and "80.000" are both eighty thousand; blank or 0 clears the goal,
// and anything else is ignored so a typo mid-edit keeps the last goal.
function parseWordGoal(text) {
  const digits = text.replace(/[,._ \u00a0]/g, "");
  if (digits === "") return null;
  if (!/^\d+$/.test(digits)) return undefined;
  const goal = Number(digits);
  if (!Number.isSafeInteger(goal)) return undefined;
  return goal > 0 ? goal : null;
}

function wordGoalSection() {
  const label = fieldLabel("Manuscript word target");
  const input = document.createElement("input");
  input.type = "text";
  input.inputMode = "numeric";
  input.placeholder = "e.g. 80000, for this novel (optional)";
  input.setAttribute("aria-label", "Manuscript word target");
  input.value = board.wordGoal === null ? "" : String(board.wordGoal);
  input.addEventListener("input", () => {
    const goal = parseWordGoal(input.value);
    if (goal === undefined || goal === board.wordGoal) return;
    board.wordGoal = goal;
    markDirty();
  });
  return [label, input];
}

function storyCalendarSection() {
  const toggle = (label, title, checked, disabled, onChange) => {
    const wrapper = document.createElement("label");
    wrapper.className = "toggle";
    wrapper.title = title;
    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = checked;
    checkbox.disabled = disabled;
    checkbox.addEventListener("change", () => { onChange(checkbox.checked); markDirty(); drawModal(); });
    wrapper.append(checkbox, ` ${label}`);
    return wrapper;
  };
  const explanation = !board.calendar ? "Story days are numbered by hand. Dates already picked are kept."
    : board.absoluteDays ? "The earliest scene date is day 1; later days count every calendar day."
      : "The earliest scene date is day 1; each later date with a scene is the next day.";
  return [fieldLabel("Story calendar"),
    toggle("Use calendar", "Pick scene dates instead of numbering days by hand", board.calendar, false,
      checked => { board.calendar = checked; }),
    toggle("Absolute days",
      "Number days by calendar distance from the first scene (Day 1, Day 5) instead of counting only dates that have scenes (Day 1, Day 2)",
      board.absoluteDays, !board.calendar, checked => { board.absoluteDays = checked; }),
    hint(explanation)];
}

function backupSection() {
  const storageState = hint("");
  navigator.storage?.persisted?.().then(persisted => {
    storageState.textContent = persisted
      ? "This browser has agreed not to clear the board's storage on its own."
      : "This browser may clear the board's storage when space runs low; link a file or export regularly.";
  }).catch(() => {});
  return [fieldLabel("Backups"),
    hint(`The last ${BACKUPS_KEPT} versions are kept in this browser: one before the first save of each visit, then every 30 minutes of editing.`),
    storageState,
    row(button("Restore backup…", "", restoreBackupDialog))];
}

async function restoreBackupDialog() {
  let backups;
  try { backups = await listBackups(); }
  catch (e) { alertDialog(`Could not read backups: ${e.message}`); return; }
  openModal({
    draw(box) {
      const heading = document.createElement("h2");
      heading.textContent = "Restore backup";
      const list = document.createElement("div");
      list.className = "backup-list";
      for (const backup of backups) {
        let summary;
        try {
          const b = parseBoard(backup.json);
          summary = `${b.title.trim() || DEFAULT_TITLE} · ${plural(b.scenes.length, "scene")}`;
        } catch {
          summary = "unreadable";
        }
        const when = new Date(backup.at).toLocaleString();
        const tag = backup.tag === "conflict" ? " · other device's version" : "";
        list.append(button(`${when} — ${summary}${tag}`, "", () => {
          try {
            const restored = parseBoard(backup.json);
            modalStack.length = 0;
            drawModal();
            history.commit(board);
            board = restored;
            selected = null;
            saveNow();
            if (saveState.kind === "saved") { saveState = {kind: "imported"}; render(); }
          } catch (e) {
            alertDialog(`Could not restore: ${e.message}`);
          }
        }));
      }
      box.append(heading,
        backups.length ? hint("Restoring can be undone.") : hint("No backups yet."),
        list, button("Cancel", "", closeModal));
    },
  });
}

/* ---------- GitHub backup to a private repository ---------- */

function readToken() {
  try { return localStorage.getItem(TOKEN_KEY) || null; } catch { return null; }
}

// Accepts owner/name or a GitHub URL for the repository, e.g. one copied from
// the address bar or a clone URL.
function parseRepo(input) {
  let path = String(input).trim().replace(/^https?:\/\/(www\.)?/, "");
  path = path.replace(/^github\.com\//, "").replace(/^git@github\.com:/, "");
  const [owner = "", rawName = ""] = path.split(/[/#?]/);
  const name = rawName.replace(/\.git$/, "");
  const ownerIsValid = /^[A-Za-z0-9-]+$/.test(owner);
  return ownerIsValid && isValidRepoName(name) ? `${owner}/${name}` : null;
}

function isValidRepoName(name) {
  return /^[A-Za-z0-9._-]{1,100}$/.test(name) && name !== "." && name !== "..";
}

function repoDescription(title) {
  const trimmed = title.trim();
  return trimmed ? `StorySquish board: ${trimmed}` : "StorySquish board";
}

// The title a push recorded in the description, or null when the
// description was not written by StorySquish.
function titleFromDescription(description) {
  const trimmed = (description ?? "").trim();
  if (trimmed === "StorySquish board") return "";
  return trimmed.startsWith("StorySquish board: ") ? trimmed.slice("StorySquish board: ".length).trim() : null;
}

function numberedRepoName(baseName, attempt) {
  return attempt === 1 ? baseName : `${baseName}-${attempt}`;
}

// The base name to rename `existing` to when `title` gives a different name
// than the title it was last backed up under, or null when the name stays,
// including when it already follows `title`, e.g. renamed on another device.
function renamedRepoBase(existing, title) {
  const previousTitle = titleFromDescription(existing.description);
  if (previousTitle === null) return null;
  const baseName = repoNameFor(title);
  const name = existing.full_name.split("/").pop();
  const followsTitle = Array.from({length: GITHUB_MAX_REPO_NAME_ATTEMPTS},
    (_, i) => numberedRepoName(baseName, i + 1)).includes(name);
  return baseName !== repoNameFor(previousTitle) && !followsTitle ? baseName : null;
}

// Compared without case, as GitHub compares repository names.
function hasRepoPrefix(name) {
  return name.toLowerCase().startsWith(GITHUB_REPO_NAME_PREFIX);
}

function prefixedRepoName(name) {
  return `${GITHUB_REPO_NAME_PREFIX}${name}`.slice(0, GITHUB_MAX_REPO_NAME_LEN).replace(/-+$/, "");
}

function repoNameFor(title) {
  let slug = "";
  for (const c of title) {
    if (/^[A-Za-z0-9]$/.test(c)) slug += c.toLowerCase();
    else if (slug && !slug.endsWith("-")) slug += "-";
  }
  slug = slug.replace(/-+$/, "");
  if (!slug) return GITHUB_UNTITLED_REPO_NAME;
  return `${GITHUB_REPO_NAME_PREFIX}${slug}`.slice(0, GITHUB_MAX_REPO_NAME_LEN).replace(/-+$/, "");
}

function commitMessage(title) {
  const trimmed = title.trim();
  return trimmed ? `Back up ${trimmed}` : "Back up untitled board";
}

function base64Utf8(text) {
  const bytes = new TextEncoder().encode(text);
  let binary = "";
  for (let i = 0; i < bytes.length; i += 0x8000) {
    binary += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  }
  return btoa(binary);
}

function describeGithubFailure(status, detail) {
  const hint = {
    401: "the token is invalid or expired",
    403: "the token lacks the Contents or Administration permission, or the rate limit was hit",
    404: "the repository does not exist or the token cannot see it",
    409: "GitHub rejected the change; another device may have backed up at the same time",
    422: "GitHub rejected the change; another device may have backed up at the same time",
  }[status] ?? "GitHub refused the request";
  return detail ? `${hint} (HTTP ${status}: ${detail})` : `${hint} (HTTP ${status})`;
}

class MissingRepoError extends Error {
  constructor(repo) {
    super(`${repo} does not exist or the token cannot see it`);
    this.repo = repo;
  }
}

class GithubError extends Error {
  constructor(status, detail, body) {
    super(describeGithubFailure(status, detail));
    this.status = status;
    this.body = body;
  }
}

// `raw` returns the file itself rather than JSON metadata; statuses listed
// in `absentOn` resolve to null instead of failing.
async function github(path, {method = "GET", body, raw = false, absentOn = []} = {}) {
  let response;
  try {
    response = await fetch(`${GITHUB_API}${path}`, {
      method,
      headers: {
        Accept: raw ? "application/vnd.github.raw+json" : "application/vnd.github+json",
        "X-GitHub-Api-Version": "2022-11-28",
        Authorization: `Bearer ${githubBackup.token}`,
        ...(body ? {"Content-Type": "application/json"} : {}),
      },
      body: body ? JSON.stringify(body) : undefined,
      cache: "no-store",
    });
  } catch (e) {
    throw new Error(`contacting GitHub: ${e.message}`);
  }
  const text = await response.text();
  if (absentOn.includes(response.status)) return null;
  if (!response.ok) {
    let detail = "";
    try { detail = JSON.parse(text).message ?? ""; } catch { /* not JSON */ }
    throw new GithubError(response.status, detail, text);
  }
  if (raw) return text;
  try { return JSON.parse(text); } catch { throw new Error("GitHub sent an unexpected response"); }
}

function boardFilePath(repo) {
  return `/repos/${repo}/contents/${GITHUB_BOARD_FILE}`;
}

// A taken name is an error, never a reuse of someone else's repository.
async function createRepo(name, title) {
  if (!isValidRepoName(name)) throw new Error(`“${name}” is not a valid repository name`);
  try {
    const created = await github("/user/repos", {method: "POST", body: {
      name, description: repoDescription(title), private: true,
      has_issues: false, has_projects: false, has_wiki: false,
    }});
    return created.full_name;
  } catch (e) {
    if (e instanceof GithubError && e.status === 422 && e.body.includes("name already exists")) {
      throw new Error(`${name} already exists on your account; choose another name`);
    }
    throw e;
  }
}

// The title's slug, numbered past names the account already uses, with the
// account it would be created on.
async function suggestRepoName(title) {
  const {login} = await github("/user");
  const baseName = repoNameFor(title);
  for (let attempt = 1; attempt <= GITHUB_MAX_REPO_NAME_ATTEMPTS; attempt++) {
    const name = numberedRepoName(baseName, attempt);
    if (await github(`/repos/${login}/${name}`, {absentOn: [404]}) === null) return {owner: login, name};
  }
  throw new Error(`every repository name tried for this board, from ${baseName}, is taken`);
}

// Tries `baseName` and its numbered variants, keeping the current name when
// every one is taken, and returns the resulting owner/name.
async function renameRepo(repo, baseName) {
  for (let attempt = 1; attempt <= GITHUB_MAX_REPO_NAME_ATTEMPTS; attempt++) {
    try {
      const renamed = await github(`/repos/${repo}`, {method: "PATCH", body: {name: numberedRepoName(baseName, attempt)}});
      return renamed.full_name;
    } catch (e) {
      if (!(e instanceof GithubError && e.status === 422 && e.body.includes("already exists"))) throw e;
    }
  }
  return repo;
}

// A repository that is gone or public keeps its name; the next push reports either.
async function addRepoPrefix(repo) {
  if (hasRepoPrefix(repo.split("/").pop())) return repo;
  const existing = await github(`/repos/${repo}`, {absentOn: [404]});
  if (!existing) return repo;
  const name = existing.full_name.split("/").pop();
  if (!existing.private || hasRepoPrefix(name)) return existing.full_name;
  return renameRepo(existing.full_name, prefixedRepoName(name));
}

// Runs on page load, the browser's way of opening the board.
async function addPrefixToLinkedRepo() {
  const repo = settings.githubRepo;
  if (!githubBackup.token || githubBackup.busy || !repo || hasRepoPrefix(repo.split("/").pop())) return;
  try {
    const renamed = await runGithubJob(() => addRepoPrefix(repo));
    if (renamed !== repo && settings.githubRepo === repo) {
      settings.githubRepo = renamed;
      saveSettingsReportingErrors();
    }
  } catch (e) {
    githubBackup.error = `Could not rename the repository to start with ${GITHUB_REPO_NAME_PREFIX}: ${e.message}`;
  }
  drawModal();
}

// Refuses a public repository, so a pasted link can never publish the novel,
// and renames the repository when the title changes.
async function pushBoard(repo, title, json) {
  const existing = await github(`/repos/${repo}`, {absentOn: [404]});
  if (!existing) throw new MissingRepoError(repo);
  if (!existing.private) throw new Error(`${repo} is public; StorySquish backs up only to private repositories`);
  const baseName = renamedRepoBase(existing, title);
  repo = baseName ? await renameRepo(existing.full_name, baseName) : existing.full_name;
  const description = repoDescription(title);
  if (existing.description !== description) {
    await github(`/repos/${repo}`, {method: "PATCH", body: {description}});
  }
  const current = await github(boardFilePath(repo), {absentOn: [404]});
  await github(boardFilePath(repo), {method: "PUT", body: {
    message: commitMessage(title),
    content: base64Utf8(json),
    ...(current ? {sha: current.sha} : {}),
  }});
  return repo;
}

async function runGithubJob(job) {
  githubBackup.busy = true;
  drawModal();
  try {
    return await job();
  } finally {
    githubBackup.busy = false;
    drawModal();
  }
}

// Asks before creating a repository for the first push, or when the linked
// one is gone, then commits to it.
async function backUpToGithub(kind) {
  if (!githubBackup.token || githubBackup.busy || githubBackup.repoCreationOpen) return;
  if (!settings.githubRepo) {
    repoCreationDialog(null);
    return;
  }
  githubBackup.lastAttemptAt = Date.now();
  githubBackup.boardChanged = false;
  const json = serializeBoard(board);
  try {
    const repo = await runGithubJob(() => pushBoard(settings.githubRepo, board.title, json));
    githubBackup.lastPushedJson = json;
    githubBackup.lastSuccessAt = Date.now();
    githubBackup.error = null;
    if (repo !== settings.githubRepo) {
      settings.githubRepo = repo;
      saveSettingsReportingErrors();
    }
  } catch (e) {
    if (e instanceof MissingRepoError) {
      githubBackup.error = null;
      repoCreationDialog(e.repo);
      return;
    }
    const message = `GitHub backup failed: ${e.message}`;
    if (kind === "auto" && !githubBackup.error) {
      alertDialog(`${message}\n\nEdits are still saved in this browser. Check Settings → GitHub backup.`);
    }
    githubBackup.error = message;
  }
  drawModal();
}

function hasPlaceholderTitle() {
  const title = board.title.trim();
  return !title || title === DEFAULT_TITLE;
}

// Waits while the header title is being typed, which the dialog would
// otherwise interrupt after the first keystroke; its blur tries again.
function offerRepoForNewBoard() {
  if (!githubBackup.newBoard || !githubBackup.token || githubBackup.repoCreationOpen) return;
  if (!githubBackup.boardChanged && saveState.kind !== "pending") return;
  if (document.activeElement === $("bookTitle")) return;
  githubBackup.newBoard = false;
  if (!settings.githubRepo) repoCreationDialog(null);
}

// A placeholder title is asked for first, since the suggested name comes from it.
function repoCreationDialog(missingRepo) {
  const askTitle = !missingRepo && hasPlaceholderTitle();
  const state = {
    owner: missingRepo ? missingRepo.split("/")[0] : null,
    name: missingRepo ? missingRepo.split("/").pop() : repoNameFor(askTitle ? "" : board.title),
    titleDraft: askTitle ? "" : null,
    focus: askTitle ? "title" : "name",
    edited: false, suggesting: !missingRepo, creating: false, error: null,
  };
  let suggestion = 0;
  let suggestTimer = null;
  const currentTitle = () => state.titleDraft ?? board.title;
  const redraw = () => { if (modalStack.at(-1) === dialog) drawModal(); };
  const suggest = () => {
    const title = currentTitle();
    const ticket = ++suggestion;
    suggestRepoName(title)
      .then(suggested => {
        if (ticket !== suggestion) return;
        state.owner = suggested.owner;
        if (!state.edited) state.name = suggested.name;
      }, e => {
        if (ticket === suggestion) state.error = `Could not check which names are free: ${e.message}`;
      })
      .finally(() => {
        if (ticket !== suggestion) return;
        state.suggesting = false;
        redraw();
      });
  };
  const decline = () => {
    clearTimeout(suggestTimer);
    githubBackup.repoCreationOpen = false;
    githubBackup.repoCreationDeclined = true;
  };
  const create = async () => {
    clearTimeout(suggestTimer);
    if (state.titleDraft !== null) {
      board.title = state.titleDraft.trim();
      state.titleDraft = null;
      saveNow();
    }
    state.creating = true;
    state.error = null;
    redraw();
    try {
      const repo = await runGithubJob(() => createRepo(state.name.trim(), board.title));
      const index = modalStack.indexOf(dialog);
      if (index >= 0) { modalStack.splice(index, 1); drawModal(); }
      githubBackup.repoCreationOpen = false;
      githubBackup.repoCreationDeclined = false;
      settings.githubRepo = repo;
      githubBackup.lastPushedJson = null;
      saveSettingsReportingErrors();
      backUpToGithub("manual");
    } catch (e) {
      state.creating = false;
      state.error = `Could not create the repository: ${e.message}`;
      redraw();
    }
  };
  const dialog = {
    onDismiss: decline,
    draw(box) {
      const heading = document.createElement("h2");
      heading.textContent = "Save to a GitHub repository";
      box.append(heading);
      if (missingRepo) box.append(message(`${missingRepo} does not exist, or the token cannot see it.`));
      const createButton = button("Create", "", create);
      const invalid = hint("Use letters, digits, '-', '_' or '.'");
      invalid.style.color = "var(--danger)";
      const sync = () => {
        const valid = isValidRepoName(state.name.trim());
        const titled = state.titleDraft === null || state.titleDraft.trim() !== "";
        invalid.hidden = valid;
        createButton.disabled = !valid || !titled || state.suggesting || state.creating;
      };
      const submitOnEnter = e => { if (e.key === "Enter" && !createButton.disabled) create(); };

      let titleInput = null;
      if (state.titleDraft !== null) {
        box.append(message("Give the story a title; the repository is named after it."));
        titleInput = document.createElement("input");
        titleInput.value = state.titleDraft;
        titleInput.placeholder = DEFAULT_TITLE;
        titleInput.disabled = state.creating;
        titleInput.setAttribute("aria-label", "Story title");
        titleInput.addEventListener("focus", () => { state.focus = "title"; });
        titleInput.addEventListener("input", () => {
          state.titleDraft = titleInput.value;
          state.error = null;
          if (!state.edited) { state.name = repoNameFor(state.titleDraft); nameInput.value = state.name; }
          state.suggesting = true;
          suggestion++;
          clearTimeout(suggestTimer);
          suggestTimer = setTimeout(suggest, GITHUB_SUGGEST_DELAY_MS);
          sync();
        });
        titleInput.addEventListener("keydown", submitOnEnter);
        box.append(fieldLabel("Story title"), titleInput);
      } else {
        box.append(message(`Back up “${board.title.trim() || "Untitled"}” to a new private repository ` +
          "on your GitHub account."));
      }

      const nameInput = document.createElement("input");
      nameInput.className = "repo-input";
      nameInput.value = state.name;
      nameInput.disabled = state.creating;
      nameInput.setAttribute("aria-label", "Repository name");
      nameInput.addEventListener("focus", () => { state.focus = "name"; });
      nameInput.addEventListener("input", () => { state.name = nameInput.value; state.edited = true; sync(); });
      nameInput.addEventListener("keydown", submitOnEnter);
      const owner = hint(`${state.owner ?? "…"} /`);
      owner.style.margin = "0";
      box.append(fieldLabel("Repository name"), row(owner, nameInput), invalid);
      if (!missingRepo) {
        box.append(hint("You can change the title later in the header; a repository named after the " +
          "title is renamed to match on the next backup."));
      }
      if (state.error) {
        const error = hint(state.error);
        error.style.color = "var(--danger)";
        box.append(error);
      }
      if (state.suggesting) box.append(hint("Checking which names are free…"));
      if (state.creating) box.append(hint("Creating…"));
      const cancel = button("Cancel", "", () => { closeModal(); decline(); });
      cancel.disabled = state.creating;
      box.append(row(createButton, cancel));
      sync();
      if (!state.creating) {
        // Redraws rebuild the fields, so focus and caret go back where they were.
        const focused = state.focus === "title" && titleInput ? titleInput : nameInput;
        focused.focus();
        focused.setSelectionRange(focused.value.length, focused.value.length);
      }
    },
  };
  githubBackup.repoCreationOpen = true;
  openModal(dialog);
  if (!missingRepo) suggest();
}

// At most once per interval and only after the board changed, so a long
// writing session leaves a version every few minutes, not one per keystroke.
function backUpToGithubIfDue({ignoreInterval = false} = {}) {
  if (!settings.githubAutoBackup || !githubBackup.token || githubBackup.busy) return;
  if (githubBackup.repoCreationOpen || githubBackup.repoCreationDeclined) return;
  if (!githubBackup.boardChanged || saveState.kind === "pending") return;
  if (!ignoreInterval && Date.now() - githubBackup.lastAttemptAt < GITHUB_BACKUP_INTERVAL_MS) return;
  if (serializeBoard(board) === githubBackup.lastPushedJson) { githubBackup.boardChanged = false; return; }
  backUpToGithub("auto");
}

async function githubRevisions(repo) {
  const path = `/repos/${repo}/commits?path=${GITHUB_BOARD_FILE}&per_page=${GITHUB_REVISIONS_LISTED}`;
  // GitHub answers 409 for a repository without any commits.
  const commits = await github(path, {absentOn: [409]});
  return (commits ?? []).map(c => ({version: c.sha, committedAt: c.commit.committer.date}));
}

async function githubBoardAt(repo, version) {
  const text = await github(`${boardFilePath(repo)}?ref=${version}`, {raw: true, absentOn: [404]});
  if (text === null) throw new Error(`this version of the repository has no ${GITHUB_BOARD_FILE}`);
  return text;
}

function connectGithub(token) {
  const trimmed = token.trim();
  if (!trimmed) return;
  try {
    localStorage.setItem(TOKEN_KEY, trimmed);
    githubBackup.token = trimmed;
    githubBackup.error = null;
  } catch (e) {
    githubBackup.error = `Could not save the token: ${e.message}`;
  }
}

// Forgets the token but keeps the repo link, so reconnecting resumes backing
// up to the same repo.
function disconnectGithub() {
  try { localStorage.removeItem(TOKEN_KEY); } catch { /* best effort */ }
  githubBackup.token = null;
  githubBackup.error = null;
  githubBackup.lastSuccessAt = 0;
}

function setGithubRepo(input) {
  const trimmed = input.trim();
  const repo = trimmed ? parseRepo(trimmed) : null;
  githubBackup.repoInvalid = trimmed !== "" && repo === null;
  if (githubBackup.repoInvalid || repo === settings.githubRepo) return;
  linkRepo(repo);
}

function linkRepo(repo) {
  settings.githubRepo = repo;
  githubBackup.repoCreationDeclined = false;
  githubBackup.lastPushedJson = null;
  githubBackup.lastSuccessAt = 0;
  githubBackup.error = null;
  saveSettingsReportingErrors();
}

function minutesAgo(at) {
  const minutes = Math.floor((Date.now() - at) / 60000);
  return minutes === 0 ? "just now" : minutes === 1 ? "a minute ago" : `${minutes} minutes ago`;
}

function githubStatus() {
  if (githubBackup.error) return {text: githubBackup.error, danger: true};
  if (!githubBackup.token) return null;
  if (githubBackup.busy) return {text: "Talking to GitHub…"};
  if (githubBackup.lastSuccessAt) return {text: `Backed up ${minutesAgo(githubBackup.lastSuccessAt)}`};
  if (!settings.githubRepo) return {text: "No repository yet; the first backup offers to create a private one."};
  return {text: "Not backed up in this visit yet."};
}

function githubSection() {
  const label = fieldLabel("GitHub backup");
  const parts = [label];
  if (!githubBackup.token) {
    parts.push(hint("Optionally back up the board to a private repository on your GitHub account, with " +
      "every version kept in its history. Create a fine-grained token for all repositories with the " +
      "permissions Administration and Contents: read and write (or a classic token with the repo " +
      "scope) and paste it here. It is kept in this browser's storage."));
    const input = document.createElement("input");
    input.type = "password";
    input.className = "repo-input";
    input.placeholder = "GitHub token";
    input.setAttribute("aria-label", "GitHub token");
    const connect = () => { connectGithub(input.value); drawModal(); };
    input.addEventListener("keydown", e => { if (e.key === "Enter") connect(); });
    parts.push(row(input, button("Connect", "", connect)));
  } else {
    const input = document.createElement("input");
    input.className = "repo-input";
    input.placeholder = "owner/repo or URL; empty offers to create one";
    input.setAttribute("aria-label", "GitHub repository");
    input.value = settings.githubRepo ?? "";
    input.addEventListener("change", () => { setGithubRepo(input.value); drawModal(); });
    const repoRow = row(input);
    if (settings.githubRepo) {
      const link = document.createElement("a");
      link.href = `https://github.com/${settings.githubRepo}`;
      link.target = "_blank";
      link.rel = "noopener";
      link.textContent = "Open";
      repoRow.append(link);
    }
    parts.push(repoRow);
    if (githubBackup.repoInvalid) {
      const invalid = hint("Not a GitHub repository name or URL");
      invalid.style.color = "var(--danger)";
      parts.push(invalid);
    }
    const auto = document.createElement("label");
    auto.className = "toggle";
    auto.title = "At most every five minutes while you edit, and when you leave the page";
    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = settings.githubAutoBackup;
    checkbox.addEventListener("change", () => {
      settings.githubAutoBackup = checkbox.checked;
      saveSettingsReportingErrors();
    });
    auto.append(checkbox, " Back up automatically");
    const backUp = button("Back up now", "", () => backUpToGithub("manual"));
    const restore = button("Restore from GitHub…", "", restoreGithubDialog);
    backUp.disabled = githubBackup.busy;
    restore.disabled = githubBackup.busy || !settings.githubRepo;
    const disconnect = button("Disconnect", "", () => { disconnectGithub(); drawModal(); });
    disconnect.title = "Forget the token; the repository itself stays on GitHub";
    parts.push(row(auto), row(backUp, restore, disconnect));
  }
  const status = githubStatus();
  if (status) {
    const line = hint(status.text);
    if (status.danger) line.style.color = "var(--danger)";
    parts.push(line);
  }
  return parts;
}

async function restoreGithubDialog() {
  const repo = settings.githubRepo;
  const state = {revisions: null, error: null};
  openModal({
    draw(box) {
      const heading = document.createElement("h2");
      heading.textContent = "Restore from GitHub";
      box.append(heading);
      if (state.error) {
        const error = hint(state.error);
        error.style.color = "var(--danger)";
        box.append(error);
      }
      if (state.revisions === null) {
        if (!state.error) box.append(hint("Loading versions…"));
      } else if (!state.revisions.length) {
        box.append(hint("This repository has no versions yet."));
      } else {
        box.append(hint(githubBackup.busy ? "Downloading…" : "Newest first. Restoring can be undone."));
        const list = document.createElement("div");
        list.className = "backup-list";
        for (const revision of state.revisions) {
          const when = new Date(revision.committedAt).toLocaleString();
          const choose = button(`${when} · ${revision.version.slice(0, 7)}`, "", async () => {
            state.error = null;
            let restored;
            try {
              restored = parseBoard(await runGithubJob(() => githubBoardAt(repo, revision.version)));
            } catch (e) {
              state.error = `GitHub backup failed: ${e.message}`;
              drawModal();
              return;
            }
            modalStack.length = 0;
            drawModal();
            history.commit(board);
            board = restored;
            selected = null;
            saveNow();
            if (saveState.kind === "saved") { saveState = {kind: "imported"}; render(); }
          });
          choose.disabled = githubBackup.busy;
          list.append(choose);
        }
        box.append(list);
      }
      box.append(button("Cancel", "", closeModal));
    },
  });
  try {
    state.revisions = await runGithubJob(() => githubRevisions(repo));
  } catch (e) {
    state.error = `GitHub backup failed: ${e.message}`;
  }
  drawModal();
}

  return el instanceof HTMLInputElement || el instanceof HTMLTextAreaElement
    || el instanceof HTMLSelectElement || el?.isContentEditable;
}

// Undo, Escape and Delete mean something different inside a text field, so
// those only act on the board when no field holds keyboard focus.
document.addEventListener("keydown", e => {
  if (modalOpen()) {
    if (e.key === "Escape") { e.preventDefault(); dismissModal(); }
    return;
  }
  const command = IS_MAC ? e.metaKey : e.ctrlKey;
  const key = e.key.toLowerCase();
  const plainCommand = command && !e.shiftKey && !e.altKey;

  if (plainCommand && key === "n") { e.preventDefault(); addScene(); return; }
  if (plainCommand && key === "f") { e.preventDefault(); $("search").focus(); $("search").select(); return; }
  if (plainCommand && key === "d") { e.preventDefault(); duplicateSelectedScene(); return; }

  if (isTextEntry(document.activeElement)) {
    if (e.key === "Escape") document.activeElement.blur();
    return;
  }
  if (command && !e.altKey && key === "z") {
    e.preventDefault();
    if (e.shiftKey) redo(); else undo();
    return;
  }
  const noModifiers = !command && !e.shiftKey && !e.altKey && !e.ctrlKey && !e.metaKey;
  if (e.altKey && !command && !e.shiftKey) {
    if (e.key === "ArrowLeft" || e.key === "ArrowUp") { e.preventDefault(); shiftSelection(-1); }
    if (e.key === "ArrowRight" || e.key === "ArrowDown") { e.preventDefault(); shiftSelection(1); }
    return;
  }
  if (noModifiers && e.key === "Escape") { closeInspector(); return; }
  if (noModifiers && (e.key === "Delete" || e.key === "Backspace") && selected?.kind === "scene") {
    e.preventDefault();
    confirmDeleteScene(selected.id);
  }
});

// Another tab of this page saved; follow it unless there are unsaved edits here.
window.addEventListener("storage", e => {
  if (e.key !== BOARD_KEY || e.newValue === null || saveState.kind === "pending") return;
  let loaded;
  try { loaded = parseBoard(e.newValue); } catch { return; }
  if (JSON.stringify(loaded) !== JSON.stringify(board)) replaceBoard(loaded, "reloaded");
});

const pollQuietly = () => pollLinkedFile().catch(() => {});
setInterval(pollQuietly, FILE_POLL_MS);
window.addEventListener("focus", pollQuietly);
setInterval(backUpToGithubIfDue, GITHUB_CHECK_MS);
document.addEventListener("visibilitychange", () => {
  if (document.hidden) backUpToGithubIfDue({ignoreInterval: true});
});

applyTheme(schemeByKey(settings.colorScheme));
render();
const linkedFileRestored = restoreLinkedFile().catch(() => {});
window.launchQueue?.setConsumer(({files}) => {
  const [handle] = files.filter(entry => entry.kind === "file");
  if (handle) openLaunchedFile(handle);
});
addPrefixToLinkedRepo();
const startupAlert = boardLoad.alert ?? settingsLoad.alert;
if (startupAlert) alertDialog(startupAlert);
navigator.serviceWorker?.register("sw.js").catch(() => {});
</script>
</body>
</html>
