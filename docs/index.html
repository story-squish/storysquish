const DEFAULT_SCHEME = "parchment";

/* ---------- model ---------- */

function generateId() {
  if (globalThis.crypto?.randomUUID) return crypto.randomUUID().replaceAll("-", "");
  return Array.from({length: 32}, () => Math.floor(Math.random() * 16).toString(16)).join("");
}

function defaultBoard() {
  return {title: DEFAULT_TITLE, characters: [], scenes: [], locations: [], relationships: [], items: [], wordGoal: null,
    calendar: false, absoluteDays: false, dayZero: null};
}

function isPlainObject(value) {
  return typeof value === "object" && value !== null && !Array.isArray(value);
}

function textField(value, what, fallback = "") {
  if (value === undefined) return fallback;
  if (typeof value !== "string") throw new Error(`${what} must be text`);
  return value;
}

function requiredTextField(value, what) {
  if (value === undefined) throw new Error(`${what} is missing`);
  return textField(value, what);
}

function boolField(value, what) {
  if (value === undefined) return false;
  if (typeof value !== "boolean") throw new Error(`${what} must be true or false`);
  return value;
}

// Mirrors the desktop app's usize.
function wordGoalField(value, what) {
  if (value === undefined || value === null) return null;
  if (!Number.isSafeInteger(value) || value < 0) throw new Error(`${what} must be a whole number`);
  return value;
}

// Mirrors the desktop app's StoryDate: YYYY-MM-DD in years 1 to 9999.
function dateField(value, what) {
  if (value === undefined || value === null) return null;
  if (typeof value !== "string" || epochDays(value) === null) throw new Error(`${what} must be a date as YYYY-MM-DD`);
  return value;
}

// Mirrors the desktop app's i32.
function dayField(value, what) {
  if (value === undefined || value === null) return null;
  if (!Number.isInteger(value) || value < -(2 ** 31) || value >= 2 ** 31) {
    throw new Error(`${what} must be a whole number`);
  }
  return value;
}

function listField(value, what) {
  if (value === undefined) return [];
  if (!Array.isArray(value)) throw new Error(`${what} must be a list`);
  return value;
}

function choiceField(value, what, choices, fallback) {
  if (value === undefined || value === null) return fallback;
  if (value === "" && fallback === "") return "";
  if (!choices.includes(value)) throw new Error(`${what}: unknown value ${JSON.stringify(value)}`);
  return value;
}

// The continuity checks live in the desktop app; the browser only carries
// these fields through so a round trip loses nothing.
const TIMES_OF_DAY = ["dawn", "morning", "midday", "afternoon", "evening", "night"];

function optionalTextField(value, what) {
  return value === undefined || value === null ? null : textField(value, what);
}

function timeField(value, what) {
  if (value === undefined || value === null || value === "") return null;
  if (!TIMES_OF_DAY.includes(value)) throw new Error(`${what}: unknown value ${JSON.stringify(value)}`);
  return value;
}

function parseCharacter(raw, index) {
  const what = `character ${index + 1}`;
  if (!isPlainObject(raw)) throw new Error(`${what} must be an object`);
  return {
    id: requiredTextField(raw.id, `${what} id`),
    name: requiredTextField(raw.name, `${what} name`),
    role: textField(raw.role, `${what} role`),
    gender: textField(raw.gender, `${what} gender`),
    goal: textField(raw.goal, `${what} goal`),
    notes: textField(raw.notes, `${what} notes`),
    arrivalScene: optionalTextField(raw.arrivalScene, `${what} arrival scene`),
    deathScene: optionalTextField(raw.deathScene, `${what} death scene`),
  };
}

function parseLocation(raw, index) {
  const what = `location ${index + 1}`;
  if (!isPlainObject(raw)) throw new Error(`${what} must be an object`);
  return {
    id: requiredTextField(raw.id, `${what} id`),
    name: requiredTextField(raw.name, `${what} name`),
    notes: textField(raw.notes, `${what} notes`),
    region: textField(raw.region, `${what} region`),
  };
}

function parseItem(raw, index) {
  const what = `item ${index + 1}`;
  if (!isPlainObject(raw)) throw new Error(`${what} must be an object`);
  return {
    id: requiredTextField(raw.id, `${what} id`),
    name: requiredTextField(raw.name, `${what} name`),
    notes: textField(raw.notes, `${what} notes`),
    resolvedScene: optionalTextField(raw.resolvedScene, `${what} resolved scene`),
  };
}

function parseRelationship(raw, index) {
  const what = `relationship ${index + 1}`;
  if (!isPlainObject(raw)) throw new Error(`${what} must be an object`);
  return {
    id: requiredTextField(raw.id, `${what} id`),
    from: requiredTextField(raw.from, `${what} from`),
    to: requiredTextField(raw.to, `${what} to`),
    label: textField(raw.label, `${what} label`),
  };
}

function parseScene(raw, index) {
  const what = `scene ${index + 1}`;
  if (!isPlainObject(raw)) throw new Error(`${what} must be an object`);
  return {
    id: requiredTextField(raw.id, `${what} id`),
    title: textField(raw.title, `${what} title`),
    summary: textField(raw.summary, `${what} summary`),
    status: raw.status === undefined ? "Outline" : choiceField(raw.status, `${what} status`, STATUSES, "Outline"),
    pov: raw.pov === null ? "" : textField(raw.pov, `${what} pov`),
    act: choiceField(raw.act, `${what} act`, ACTS, ""),
    location: raw.location === null ? "" : textField(raw.location, `${what} location`),
    time: timeField(raw.time, `${what} time of day`),
    flashback: boolField(raw.flashback, `${what} flashback`),
    day: dayField(raw.day, `${what} day`),
    date: dateField(raw.date, `${what} date`),
    dayHidden: boolField(raw.dayHidden, `${what} day hidden`),
    text: textField(raw.text, `${what} text`),
    chapterBreak: boolField(raw.chapterBreak, `${what} chapter break`),
  };
}

function parseBoard(text) {
  const data = JSON.parse(text);
  if (!isPlainObject(data)) throw new Error("expected a JSON object");
  if (!Array.isArray(data.scenes)) throw new Error("missing the scenes list");
  const scenes = data.scenes.map(parseScene);
  // The first calendar stored a start date and kept scene days as offsets
  // from it; those become per-scene dates.
  const storyStart = dateField(data.storyStart, "story start");
  if (storyStart !== null) {
    for (const scene of scenes) {
      if (scene.date === null && scene.day !== null) scene.date = isoFromEpochDays(epochDays(storyStart) + scene.day - 1);
    }
  }
  return {
    title: textField(data.title, "title"),
    characters: listField(data.characters ?? undefined, "characters").map(parseCharacter),
    scenes,
    locations: listField(data.locations ?? undefined, "locations").map(parseLocation),
    relationships: listField(data.relationships ?? undefined, "relationships").map(parseRelationship),
    items: listField(data.items ?? undefined, "items").map(parseItem),
    wordGoal: wordGoalField(data.wordGoal, "word goal"),
    calendar: boolField(data.calendar, "calendar") || storyStart !== null,
    absoluteDays: boolField(data.absoluteDays, "absolute days"),
    dayZero: data.dayZero === null ? null : textField(data.dayZero, "day zero", null),
  };
}

// The desktop app leaves these out when unset, so do the same.
const OMITTED_WHEN_NULL = new Set(["day", "date", "wordGoal", "dayZero", "time", "arrivalScene", "deathScene", "resolvedScene"]);
const OMITTED_WHEN_FALSE = new Set(["dayHidden", "chapterBreak", "calendar", "absoluteDays", "flashback"]);
function serializeBoard(b) {
  return JSON.stringify(b, (key, value) => ((OMITTED_WHEN_NULL.has(key) && value === null) || (OMITTED_WHEN_FALSE.has(key) && value === false)
    ? undefined : value), 2);
}

/* ---------- story calendar ---------- */

const MS_PER_DAY = 24 * 60 * 60 * 1000;
const MONTH_NAMES = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const WEEKDAY_NAMES = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

// Days since 1970-01-01 for a valid YYYY-MM-DD in years 1 to 9999, else null.
function epochDays(iso) {
  const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso);
  if (!match) return null;
  const [year, month, day] = match.slice(1).map(Number);
  const date = new Date(0);
  // setUTCFullYear, unlike Date.UTC, does not read years 0 to 99 as 1900 to 1999.
  date.setUTCFullYear(year, month - 1, day);
  const valid = year >= 1 && date.getUTCFullYear() === year && date.getUTCMonth() === month - 1 && date.getUTCDate() === day;
  return valid ? Math.round(date.getTime() / MS_PER_DAY) : null;
}

function isoFromEpochDays(days) {
  const date = new Date(days * MS_PER_DAY);
  const year = date.getUTCFullYear();
  if (!(year >= 1 && year <= 9999)) return null;
  const pad = n => String(n).padStart(2, "0");
  return `${String(year).padStart(4, "0")}-${pad(date.getUTCMonth() + 1)}-${pad(date.getUTCDate())}`;
}

function todayIso() {
  return isoFromEpochDays(Math.floor(Date.now() / MS_PER_DAY));
}

function longDateLabel(iso) {
  const date = new Date(epochDays(iso) * MS_PER_DAY);
  return `${WEEKDAY_NAMES[date.getUTCDay()]} ${date.getUTCDate()} ${MONTH_NAMES[date.getUTCMonth()]} ${date.getUTCFullYear()}`;
}

function shownDay(scene) { return scene.dayHidden ? null : scene.day; }
function shownDate(scene) { return scene.dayHidden ? null : scene.date; }

// Each scene's place in the story's chronology by board index, as {number,
// date} or null. On a calendar the earliest manuscript date is day 1, and
// archived scenes keep their date but get no number. Mirrors Board::story_days.
function storyDays(b = board) {
  const dayZeroScene = b.dayZero === null ? undefined : b.scenes.find(s => s.id === b.dayZero);
  if (!b.calendar) {
    const zero = dayZeroScene ? shownDay(dayZeroScene) : null;
    return b.scenes.map(s => {
      const number = shownDay(s);
      if (number === null) return null;
      const fromDayZero = zero === null ? null
        : {before: number < zero, elapsed: {years: 0, months: 0, days: Math.abs(number - zero)}};
      return {number, date: null, fromDayZero};
    });
  }
  const dates = manuscriptDates(b);
  const zero = dayZeroScene ? shownDate(dayZeroScene) : null;
  return b.scenes.map(s => {
    const date = shownDate(s);
    if (date === null) return null;
    const fromDayZero = zero === null ? null : {before: date < zero, elapsed: elapsedBetween(zero, date)};
    if (s.status === "Archived") return {number: null, date, fromDayZero};
    const ordinal = b.absoluteDays ? epochDays(date) - epochDays(dates[0]) : dates.indexOf(date);
    return {number: ordinal + 1, date, fromDayZero};
  });
}

function monthIndex(iso) { return Number(iso.slice(0, 4)) * 12 + Number(iso.slice(5, 7)) - 1; }

// Keeps the day of the month where it can, else the month's last day.
// Mirrors StoryDate::plus_months.
function plusMonths(iso, months) {
  const index = monthIndex(iso) + months;
  const year = Math.floor(index / 12);
  if (year < 1 || year > 9999) return null;
  const pad = n => String(n).padStart(2, "0");
  const yearMonth = `${String(year).padStart(4, "0")}-${pad(index - year * 12 + 1)}`;
  for (let day = Number(iso.slice(8, 10)); day >= 28; day--) {
    if (epochDays(`${yearMonth}-${pad(day)}`) !== null) return `${yearMonth}-${pad(day)}`;
  }
  return `${yearMonth}-${iso.slice(8, 10)}`;
}

// Whole years and months, then leftover days, stepping months from `from`
// so 31 Mar back to 28 Feb is one month. Mirrors StoryDate::elapsed_until.
function elapsedBetween(from, to) {
  const direction = to < from ? -1 : 1;
  const overshoots = months => {
    const stepped = plusMonths(from, direction * months);
    return stepped === null || (direction > 0 ? stepped > to : stepped < to);
  };
  let months = Math.abs(monthIndex(to) - monthIndex(from));
  if (months > 0 && overshoots(months)) months -= 1;
  const stepped = plusMonths(from, direction * months);
  const days = stepped === null ? 0 : Math.abs(epochDays(to) - epochDays(stepped));
  return {years: Math.floor(months / 12), months: months % 12, days};
}

// "day 0", "2 days before", "3 months 4 days after" or "1 year 2 months
// before"; days are dropped once there are years. Mirrors DayZeroOffset::label.
function dayZeroOffsetLabel({before, elapsed: {years, months, days}}) {
  const units = years > 0 ? [[years, "year"], [months, "month"]] : [[months, "month"], [days, "day"]];
  const amounts = units.filter(([count]) => count > 0).map(([count, unit]) => plural(count, unit));
  return amounts.length ? `${amounts.join(" ")} ${before ? "before" : "after"}` : "day 0";
}

// Distinct shown dates of manuscript scenes, earliest first, optionally
// leaving one scene out so it can be renumbered against the others.
function manuscriptDates(b = board, excluding = -1) {
  const dates = manuscriptScenes(b).filter(({index}) => index !== excluding).map(({scene}) => shownDate(scene));
  return [...new Set(dates.filter(d => d !== null))].sort();
}

// The date that would be day `number` among `dates`. Counting only dates
// with scenes, a number past the last day lands that many days after it, and
// one before day 1 that many days before it. Mirrors CalendarDays::date_of.
function dateOfDayNumber(dates, number, absolute) {
  if (!dates.length) return null;
  const ordinal = number - 1;
  if (absolute || ordinal < 0) return isoFromEpochDays(epochDays(dates[0]) + ordinal);
  if (ordinal < dates.length) return dates[ordinal];
  return isoFromEpochDays(epochDays(dates.at(-1)) + ordinal - (dates.length - 1));
}

// "Day 3", "Day 3 · Wed 18 Mar 2026" or, for archived scenes on a calendar,
// "Wed 18 Mar 2026", with the distance from day 0 before the date when the
// board has one: "Day 3 · 2 days before · Wed 18 Mar 2026".
function storyDayLabel({number, date, fromDayZero}) {
  return [
    number === null ? null : `Day ${number}`,
    fromDayZero === null ? null : dayZeroOffsetLabel(fromDayZero),
    date === null ? null : longDateLabel(date),
  ].filter(part => part !== null).join(" · ");
}

function sceneIndex(id) { return board.scenes.findIndex(s => s.id === id); }
function characterIndex(id) { return board.characters.findIndex(c => c.id === id); }
function findCharacter(id) { return id ? board.characters.find(c => c.id === id) : undefined; }
function povSceneCount(id) { return board.scenes.filter(s => s.pov === id).length; }
function locationIndex(id) { return board.locations.findIndex(l => l.id === id); }
function findLocation(id) { return id ? board.locations.find(l => l.id === id) : undefined; }
function locationSceneCount(id) { return board.scenes.filter(s => s.location === id).length; }

function wordCount(text) {
  const trimmed = text.trim();
  return trimmed ? trimmed.split(/\s+/).length : 0;
}

function manuscriptScenes(b = board) {
  return b.scenes.map((scene, index) => ({scene, index})).filter(({scene}) => scene.status !== "Archived");
}

function sceneWords(entries) {
  return entries.reduce((sum, {scene}) => sum + wordCount(scene.text), 0);
}

function manuscriptWordCount(b = board) {
  return sceneWords(manuscriptScenes(b));
}

// Acts in order, then "" for scenes without an act.
function actWordCounts() {
  const scenes = manuscriptScenes();
  return [...ACTS, ""].map(act => [act, sceneWords(scenes.filter(({scene}) => scene.act === act))]);
}

// Characters with a manuscript POV scene, most words first.
function povWordCounts() {
  const scenes = manuscriptScenes();
  return board.characters
    .map(character => [character, scenes.filter(({scene}) => scene.pov === character.id)])
    .filter(([, owned]) => owned.length > 0)
    .map(([character, owned]) => [character, sceneWords(owned)])
    .sort((a, b) => b[1] - a[1]);
}

const HONORIFICS = new Set([
  "mr", "mrs", "ms", "miss", "dr", "sir", "dame", "lady", "lord", "captain", "professor", "king",
  "queen", "prince", "princess", "aunt", "uncle", "saint", "st", "the", "of", "von",
]);

function wordsOf(text) {
  return text.split(/[^\p{L}\p{N}]+/u).filter(Boolean);
}

// Capitalized because prose capitalizes names and a lowercase match
// ("will", "hope") is usually not the name.
function distinctiveNameParts(name) {
  return new Set(wordsOf(name)
    .filter(part => Array.from(part).length >= 2 && !HONORIFICS.has(part.toLowerCase()))
    .map(part => part[0].toUpperCase() + part.slice(1)));
}

// Manuscript scenes each character appears in, in board order: as POV, or by
// a name part no other character shares, written as a whole word in the
// title, summary or prose.
function characterAppearances() {
  const nameParts = board.characters.map(c => distinctiveNameParts(c.name));
  const owners = new Map();
  for (const part of nameParts.flatMap(parts => [...parts])) owners.set(part, (owners.get(part) ?? 0) + 1);
  const sceneWords = manuscriptScenes().map(({scene, index}) =>
    ({scene, index, words: new Set([scene.title, scene.summary, scene.text].flatMap(wordsOf))}));
  return board.characters.map((character, i) => {
    const unique = [...nameParts[i]].filter(part => owners.get(part) === 1);
    const scenes = sceneWords
      .filter(({scene, words}) => scene.pov === character.id || unique.some(part => words.has(part)))
      .map(({index}) => index);
    return [character, scenes];
  });
}

function sceneGaps() {
  const scenes = manuscriptScenes();
  const indicesWhere = missing => scenes.filter(({scene}) => missing(scene)).map(({index}) => index);
  const days = storyDays();
  return {
    pov: indicesWhere(s => !s.pov),
    location: indicesWhere(s => !s.location),
    day: scenes.filter(({index}) => days[index] === null).map(({index}) => index),
  };
}

// Dated, non-archived scenes in story order; same-day scenes keep board order.
function chronologicalIndices() {
  const days = storyDays();
  return manuscriptScenes()
    .filter(({index}) => days[index] !== null)
    .sort((a, b) => days[a.index].number - days[b.index].number || a.index - b.index)
    .map(({index}) => index);
}

// Each scene's chapter by board index, as {number, starts} or null. Chapters
// split the manuscript scenes at chapter breaks, and once there is one, the
// first scene opens chapter 1 so no prose falls outside a chapter.
function chapters(b = board) {
  const places = b.scenes.map(() => null);
  const scenes = manuscriptScenes(b);
  if (!scenes.some(({scene}) => scene.chapterBreak)) return places;
  let number = 0;
  for (const {scene, index} of scenes) {
    const starts = number === 0 || scene.chapterBreak;
    if (starts) number += 1;
    places[index] = {number, starts};
  }
  return places;
}

function chapterCount() {
  return Math.max(0, ...chapters().filter(Boolean).map(place => place.number));
}

function addSceneToBoard() {
  const scene = {
    id: generateId(), title: "", summary: "", status: "Outline", pov: "", act: "",
    location: "", time: null, flashback: false, day: null, date: null, dayHidden: false, text: "", chapterBreak: false,
  };
  board.scenes.push(scene);
  return scene.id;
}

function duplicateSceneOnBoard(id) {
  const index = sceneIndex(id);
  if (index < 0) return null;
  const original = board.scenes[index];
  const copy = {
    ...original,
    id: generateId(),
    title: original.title ? `${original.title} (copy)` : "",
    chapterBreak: false,
  };
  board.scenes.splice(index + 1, 0, copy);
  return copy.id;
}

function shiftBy(items, id, offset) {
  const from = items.findIndex(item => item.id === id);
  const to = from + offset;
  if (from < 0 || to < 0 || to >= items.length || to === from) return false;
  const [item] = items.splice(from, 1);
  items.splice(to, 0, item);
  return true;
}

function moveScene(from, to) {
  const count = board.scenes.length;
  if (from >= count || to >= count || from === to) return;
  const [scene] = board.scenes.splice(from, 1);
  board.scenes.splice(to, 0, scene);
}

function addCharacterToBoard(name) {
  const trimmed = name.trim();
  if (!trimmed) return false;
  board.characters.push({id: generateId(), name: trimmed, role: "", gender: "", goal: "", notes: "", arrivalScene: null, deathScene: null});
  return true;
}

function deleteCharacterFromBoard(id) {
  board.characters = board.characters.filter(c => c.id !== id);
  board.relationships = board.relationships.filter(r => r.from !== id && r.to !== id);
  for (const scene of board.scenes) if (scene.pov === id) scene.pov = "";
}

function addLocationToBoard(name) {
  const trimmed = name.trim();
  if (!trimmed) return false;
  board.locations.push({id: generateId(), name: trimmed, notes: "", region: ""});
  return true;
}

function deleteLocationFromBoard(id) {
  board.locations = board.locations.filter(l => l.id !== id);
  for (const scene of board.scenes) if (scene.location === id) scene.location = "";
}

function addRelationshipToBoard(from, to, label) {
  if (from === to || !findCharacter(from) || !findCharacter(to)) return false;
  board.relationships.push({id: generateId(), from, to, label: label.trim()});
  return true;
}

function hasRelationship(from, to) {
  return board.relationships.some(r => r.from === from && r.to === to);
}

function addReverseRelationshipToBoard(id) {
  const relationship = board.relationships.find(r => r.id === id);
  if (!relationship || hasRelationship(relationship.to, relationship.from)) return false;
  return addRelationshipToBoard(relationship.to, relationship.from, "");
}

function matchingIndices() {
  const needle = filters.query.trim().toLowerCase();
  const indices = [];
  board.scenes.forEach((scene, index) => {
    if (filters.status && scene.status !== filters.status) return;
    if (filters.act && scene.act !== filters.act) return;
    if (filters.pov && scene.pov !== filters.pov) return;
    if (needle) {
      const povName = findCharacter(scene.pov)?.name ?? "";
      const locationName = findLocation(scene.location)?.name ?? "";
      const haystack = [scene.title, scene.summary, scene.status, scene.act, povName, locationName, scene.text]
        .join(" ").toLowerCase();
      if (!haystack.includes(needle)) return;
    }
    indices.push(index);
  });
  return indices;
}

/* ---------- history ---------- */

// Snapshots are compared as JSON; a burst of edits between two commits
// becomes a single undo step.
class History {
  constructor(initial, limit) {
    this.checkpoint = JSON.stringify(initial);
    this.undoStack = [];
    this.redoStack = [];
    this.limit = Math.max(1, limit);
  }
  commit(current) {
    const snapshot = JSON.stringify(current);
    if (snapshot === this.checkpoint) return false;
    this.undoStack.push(this.checkpoint);
    if (this.undoStack.length > this.limit) this.undoStack.shift();
    this.checkpoint = snapshot;
    this.redoStack = [];
    return true;
  }
  undo(current) {
    this.commit(current);
    const previous = this.undoStack.pop();
    if (previous === undefined) return null;
    this.redoStack.push(this.checkpoint);
    this.checkpoint = previous;
    return JSON.parse(previous);
  }
  redo(current) {
    if (JSON.stringify(current) !== this.checkpoint) return null;
    const next = this.redoStack.pop();
    if (next === undefined) return null;
    this.undoStack.push(this.checkpoint);
    this.checkpoint = next;
    return JSON.parse(next);
  }
  canUndo(current) {
    return this.undoStack.length > 0 || JSON.stringify(current) !== this.checkpoint;
  }
  canRedo(current) {
    return this.redoStack.length > 0 && JSON.stringify(current) === this.checkpoint;
  }
}

/* ---------- outline / export ---------- */

function sceneNumber(index) {
  return `SCENE ${String(index + 1).padStart(2, "0")}`;
}

// Archived scenes are cut material, so they stay out of the outline; the
// remaining scenes keep their board numbers so they match the cards.
function toMarkdown(b) {
  let out = `# ${b.title.trim() || DEFAULT_TITLE}\n\n`;
  const places = chapters(b);
  const days = storyDays(b);
  const sceneLevel = places.some(Boolean) ? "###" : "##";
  b.scenes.forEach((scene, index) => {
    if (scene.status === "Archived") return;
    out += chapterHeading(places[index]);
    out += `${sceneLevel} Scene ${String(index + 1).padStart(2, "0")}: ${scene.title.trim() || "Untitled"}\n\n`;
    const facts = [scene.status];
    if (scene.act) facts.push(scene.act);
    const pov = b.characters.find(c => c.id === scene.pov && scene.pov);
    if (pov) facts.push(`POV: ${pov.name.trim()}`);
    const location = b.locations.find(l => l.id === scene.location && scene.location);
    if (location) facts.push(`Location: ${location.name.trim()}`);
    if (days[index] !== null) facts.push(storyDayLabel(days[index]));
    out += `_${facts.join(" · ")}_\n\n`;
    const summary = scene.summary.trim();
    if (summary) out += `${summary}\n\n`;
  });
  if (b.characters.length) {
    out += "## Characters\n\n";
    for (const character of b.characters) {
      out += `### ${character.name.trim()}\n\n`;
      for (const [field, value] of [["Role", character.role], ["Gender", character.gender], ["Goal", character.goal]]) {
        if (value.trim()) out += `**${field}:** ${value.trim()}\n\n`;
      }
      const outgoing = b.relationships.filter(r => r.from === character.id);
      for (const relationship of outgoing) {
        const other = b.characters.find(c => c.id === relationship.to);
        if (other) out += `- ${relationship.label.trim() || "related to"} → ${other.name.trim()}\n`;
      }
      if (outgoing.length) out += "\n";
      const notes = character.notes.trim();
      if (notes) out += `${notes}\n\n`;
    }
  }
  if (b.locations.length) {
    out += "## Locations\n\n";
    for (const location of b.locations) {
      out += `### ${location.name.trim()}\n\n`;
      const notes = location.notes.trim();
      if (notes) out += `${notes}\n\n`;
    }
  }
  return out.trimEnd() + "\n";
}

// The prose of every non-archived scene in board order, one heading per scene
// under its chapter's, ready to paste into a word processor. An untitled
// scene gets a scene-break heading unless it opens a chapter.
function manuscriptMarkdown(b) {
  let out = `# ${b.title.trim() || DEFAULT_TITLE}\n\n`;
  const places = chapters(b);
  const sceneLevel = places.some(Boolean) ? "###" : "##";
  for (const [index, scene] of b.scenes.entries()) {
    if (scene.status === "Archived") continue;
    out += chapterHeading(places[index]);
    const title = scene.title.trim();
    if (title) out += `${sceneLevel} ${title}\n\n`;
    else if (!places[index]?.starts) out += `${sceneLevel} * * *\n\n`;
    const text = scene.text.trim();
    if (text) out += `${text}\n\n`;
  }
  return out.trimEnd() + "\n";
}

function chapterHeading(place) {
  return place?.starts ? `## Chapter ${place.number}\n\n` : "";
}

// The outline and the manuscript under one title, each a section with its
// own headings nested one level deeper.
function combinedMarkdown(b) {
  let out = `# ${b.title.trim() || DEFAULT_TITLE}\n\n`;
  for (const [section, document] of [["Outline", toMarkdown(b)], ["Manuscript", manuscriptMarkdown(b)]]) {
    out += `## ${section}\n\n`;
    const newline = document.indexOf("\n");
    const body = newline < 0 ? "" : document.slice(newline + 1).replace(/^\n+/, "");
    if (!body) continue;
    for (const line of body.trimEnd().split("\n")) out += `${line.startsWith("#") ? "#" : ""}${line}\n`;
    out += "\n";
  }
  return out.trimEnd() + "\n";
}

function exportFileName(extension, suffix = null) {
  const stem = (board.title.trim() || "novel").split(/\s+/).join("_");
  return suffix ? `${stem}_${suffix}.${extension}` : `${stem}.${extension}`;
}

function download(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], {type}));
  const link = document.createElement("a");
  link.href = url;
  link.download = name;
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 0);
}

/* ---------- storage ---------- */

function migrateLegacyBoard() {
  if (localStorage.getItem(BOARD_KEY) !== null) return;
  for (const key of LEGACY_BOARD_KEYS) {
    const raw = localStorage.getItem(key);
    if (raw === null) continue;
    localStorage.setItem(BOARD_KEY, raw);
    localStorage.removeItem(key);
    return;
  }
}

// An unreadable board is moved aside rather than silently overwritten by the
// next autosave.
function loadBoard() {
  let migrationAlert = null;
  try { migrateLegacyBoard(); }
  catch (e) { migrationAlert = `Could not carry over data from before the rename: ${e.message}`; }

  let raw;
  try { raw = localStorage.getItem(BOARD_KEY); }
  catch (e) { return {board: defaultBoard(), alert: `Could not open your board: ${e.message}`}; }
  if (raw === null) return {board: defaultBoard(), alert: migrationAlert, neverSaved: true};

  try {
    return {board: parseBoard(raw), alert: migrationAlert};
  } catch (err) {
    const backupKey = `${BOARD_KEY}.corrupt`;
    let note;
    try {
      localStorage.setItem(backupKey, raw);
      localStorage.removeItem(BOARD_KEY);
      note = `It was moved to "${backupKey}" in this browser's storage.`;
    } catch (e) {
      note = `Moving it aside also failed: ${e.message}.`;
    }
    return {
      board: defaultBoard(),
      alert: `Could not open your board: ${err.message}\n\n${note} Starting with an empty board.`,
    };
  }
}

function loadSettings() {
  const defaults = {colorScheme: DEFAULT_SCHEME, lastExportAt: 0, githubRepo: null, githubAutoBackup: false};
  try {
    const raw = localStorage.getItem(SETTINGS_KEY);
    if (raw === null) return {settings: defaults, alert: null};
    const data = JSON.parse(raw);
    if (!isPlainObject(data)) throw new Error("expected a JSON object");
    const scheme = data["color-scheme"] ?? DEFAULT_SCHEME;
    if (!COLOR_SCHEMES.some(s => s.key === scheme)) throw new Error(`unknown color scheme ${JSON.stringify(scheme)}`);
    const lastExportAt = data["last-export"] ?? 0;
    if (!Number.isFinite(lastExportAt)) throw new Error("last-export must be a timestamp");
    const githubRepo = data["github-repo"] ?? null;
    if (githubRepo !== null && parseRepo(githubRepo) !== githubRepo) {
      throw new Error("github-repo must be owner/name");
    }
    const githubAutoBackup = data["github-auto-backup"] ?? data["gist-auto-backup"] ?? false;
    if (typeof githubAutoBackup !== "boolean") throw new Error("github-auto-backup must be true or false");
    return {settings: {colorScheme: scheme, lastExportAt, githubRepo, githubAutoBackup}, alert: null};
  } catch (e) {
    return {settings: defaults, alert: `Could not read settings, using defaults: ${e.message}`};
  }
}

function persistSettings() {
  localStorage.setItem(SETTINGS_KEY, JSON.stringify({
    "color-scheme": settings.colorScheme,
    "last-export": settings.lastExportAt,
    ...(settings.githubRepo ? {"github-repo": settings.githubRepo} : {}),
    "github-auto-backup": settings.githubAutoBackup,
  }, null, 2));
}

/* ---------- IndexedDB: backups and the linked file handle ---------- */

let dbPromise = null;

function openDb() {
  if (!globalThis.indexedDB) return Promise.reject(new Error("this browser has no IndexedDB"));
  dbPromise ??= new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, 1);
    request.onupgradeneeded = () => {
      request.result.createObjectStore("backups", {keyPath: "id", autoIncrement: true});
      request.result.createObjectStore("handles");
    };
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => { dbPromise = null; reject(request.error); };
  });
  return dbPromise;
}

async function idb(storeName, mode, operation) {
  const db = await openDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, mode);
    const request = operation(tx.objectStore(storeName));
    tx.oncomplete = () => resolve(request?.result);
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error ?? new Error("transaction aborted"));
  });
}

async function addBackup(json, tag = "") {
  await idb("backups", "readwrite", store => store.add({at: Date.now(), tag, json}));
  const keys = await idb("backups", "readonly", store => store.getAllKeys());
  const excess = keys.slice(0, Math.max(0, keys.length - BACKUPS_KEPT));
  if (excess.length) await idb("backups", "readwrite", store => { for (const key of excess) store.delete(key); });
}

async function listBackups() {
  return (await idb("backups", "readonly", store => store.getAll())).reverse();
}

function readFileMeta() {
  try { return {lastModified: 0, unsynced: false, ...JSON.parse(localStorage.getItem(FILE_KEY) ?? "{}")}; }
  catch { return {lastModified: 0, unsynced: false}; }
}

function writeFileMeta(meta) {
  try { localStorage.setItem(FILE_KEY, JSON.stringify(meta)); } catch { /* best effort */ }
}

/* ---------- app state ---------- */

const $ = id => document.getElementById(id);

const settingsLoad = loadSettings();
let settings = settingsLoad.settings;
let settingsSaveError = null;

const boardLoad = loadBoard();
let board = boardLoad.board;
const history = new History(board, UNDO_LIMIT);

let selected = null;
let saveState = {kind: "saved"};
let saveTimer = null;
let focusSceneTitle = false;
let showStats = false;
const filters = {query: "", status: "", act: "", pov: ""};
let dragFrom = null;
const modalStack = [];
let view = "board";
let lastBackupAt = 0;
let persistRequested = false;
// {handle, name, connected, lastModified}; null when the board only lives here.
let linkedFile = null;
let fileWrites = Promise.resolve();
const githubBackup = {
  token: readToken(), busy: false, error: null, repoInvalid: false,
  boardChanged: false, lastAttemptAt: 0, lastSuccessAt: 0, lastPushedJson: null,
  // A cancelled repo creation stops automatic backup from asking again this visit.
  repoCreationOpen: false, repoCreationDeclined: false,
  // A board never saved in this browser, or just reset, whose first change offers it a repository.
  newBoard: boardLoad.neverSaved === true,
  // {repo, before, after}: the link a Reset removed, with the boards on either side of it.
  resetLink: null,
};

function isSelected(kind, id) {
  return selected?.kind === kind && selected.id === id;
}

function schemeByKey(key) {
  return COLOR_SCHEMES.find(s => s.key === key) ?? COLOR_SCHEMES[0];
}

function applyTheme(p) {
  const style = document.documentElement.style;
  const vars = {
    board: p.board, header: p.header, "header-text": p.headerText, ink: p.ink, muted: p.muted,
    card: p.card, line: p.line, sidebar: p.sidebar, inspector: p.inspector, accent: p.accent,
    "on-accent": p.onAccent, danger: p.danger, act: p.act, field: p.field,
  };
  for (const [name, value] of Object.entries(vars)) style.setProperty(`--${name}`, value);
  STATUSES.forEach((status, i) => style.setProperty(`--status-${status}`, p.statuses[i]));
  style.colorScheme = p.dark ? "dark" : "light";
}

function saveSettingsReportingErrors() {
  try {
    persistSettings();
    settingsSaveError = null;
  } catch (e) {
    settingsSaveError = `Could not save settings: ${e.message}`;
  }
}

function setColorScheme(key) {
  settings.colorScheme = key;
  applyTheme(schemeByKey(key));
  saveSettingsReportingErrors();
}

/* ---------- saving ---------- */

function saveNow() {
  clearTimeout(saveTimer);
  saveTimer = null;
  history.commit(board);
  backUpIfDue();
  requestPersistentStorage();
  const json = serializeBoard(board);
  try {
    localStorage.setItem(BOARD_KEY, json);
    saveState = {kind: "saved"};
  } catch (e) {
    saveState = {kind: "failed", reason: e.message};
  }
  writeToLinkedFile(json);
  githubBackup.boardChanged = true;
  render();
  offerRepoForNewBoard();
}

// Runs before the session's first write and then periodically, so backups
// hold the board as it was before each stretch of editing.
function backUpIfDue() {
  if (Date.now() - lastBackupAt < BACKUP_INTERVAL_MS) return;
  lastBackupAt = Date.now();
  let previous;
  try { previous = localStorage.getItem(BOARD_KEY); } catch { return; }
  if (previous === null) return;
  addBackup(previous).catch(e => alertDialog(`Could not back up the board: ${e.message}`));
}

// Without this, browsers may evict the board under storage pressure.
function requestPersistentStorage() {
  if (persistRequested) return;
  persistRequested = true;
  navigator.storage?.persist?.().catch(() => {});
}

/* ---------- linked file ---------- */

function writeToLinkedFile(json) {
  if (!linkedFile) return;
  if (!linkedFile.connected) {
    writeFileMeta({...readFileMeta(), unsynced: true});
    return;
  }
  const target = linkedFile;
  fileWrites = fileWrites
    .then(() => writeBoardFile(target, json))
    .catch(e => {
      writeFileMeta({...readFileMeta(), unsynced: true});
      saveState = {kind: "failed", reason: `Could not write ${target.name}: ${e.message}`};
      render();
    });
}

// Another device rewrote the file while there were unsaved edits here. Ours
// wins, but theirs is kept as a backup; if that fails, the write is refused.
async function writeBoardFile(target, json) {
  const current = await target.handle.getFile();
  if (current.lastModified !== target.lastModified) {
    await addBackup(await current.text(), "conflict");
    alertDialog(`${target.name} was changed outside this tab, perhaps on another device, while you had ` +
      "unsaved edits here. Your version was kept; the other one is in Settings → Restore backup.");
  }
  const writable = await target.handle.createWritable();
  await writable.write(json);
  await writable.close();
  target.lastModified = (await target.handle.getFile()).lastModified;
  writeFileMeta({lastModified: target.lastModified, unsynced: false});
}

function replaceBoard(loaded, kind) {
  history.commit(board);
  board = loaded;
  githubBackup.newBoard = false;
  githubBackup.boardChanged = true;
  history.commit(board);
  try { localStorage.setItem(BOARD_KEY, serializeBoard(board)); } catch { /* next save retries */ }
  saveState = {kind};
  render();
}

// Picks up edits synced in from another device. Skipped while edits are
// pending here; writeBoardFile handles that case as a conflict.
async function pollLinkedFile() {
  if (!linkedFile?.connected || document.hidden) return;
  await fileWrites;
  const target = linkedFile;
  const busy = () => target !== linkedFile || saveState.kind === "pending" || saveState.kind === "failed";
  if (busy()) return;
  const file = await target.handle.getFile();
  if (file.lastModified === target.lastModified) return;
  let loaded;
  // A parse failure usually means a sync client is mid-write; try again later.
  try { loaded = parseBoard(await file.text()); } catch { return; }
  if (busy()) return;
  target.lastModified = file.lastModified;
  writeFileMeta({lastModified: file.lastModified, unsynced: false});
  if (JSON.stringify(loaded) !== JSON.stringify(board)) replaceBoard(loaded, "reloaded");
}

async function rememberHandle(handle) {
  try { await idb("handles", "readwrite", store => store.put(handle, "board")); }
  catch (e) { alertDialog(`The file is linked for now, but could not be remembered: ${e.message}`); }
}

async function openLinkedFile() {
  let handle;
  try {
    [handle] = await showOpenFilePicker({types: [{description: "StorySquish board", accept: {"application/json": [".json"]}}]});
  } catch (e) {
    if (e.name !== "AbortError") alertDialog(`Could not open the file: ${e.message}`);
    return;
  }
  try {
    if (await handle.requestPermission({mode: "readwrite"}) !== "granted") return;
    await linkBoardFile(handle, {connected: true});
  } catch (e) {
    alertDialog(`Could not open ${handle.name}: ${e.message}`);
  }
}

async function linkBoardFile(handle, {connected}) {
  const file = await handle.getFile();
  const loaded = parseBoard(await file.text());
  if (saveState.kind === "pending") saveNow();
  linkedFile = {handle, name: handle.name, connected, lastModified: file.lastModified};
  writeFileMeta({lastModified: file.lastModified, unsynced: false});
  selected = null;
  replaceBoard(loaded, "imported");
  await rememberHandle(handle);
}

// A file opened from the OS may come with read access only, and asking for
// write access needs a click, so it links disconnected and offers Reconnect.
async function openLaunchedFile(handle) {
  await linkedFileRestored;
  try {
    const writable = await handle.queryPermission({mode: "readwrite"}) === "granted";
    await linkBoardFile(handle, {connected: writable});
  } catch (e) {
    alertDialog(`Could not open ${handle.name}: ${e.message}`);
  }
}

async function saveToLinkedFile() {
  let handle;
  try {
    handle = await showSaveFilePicker({
      suggestedName: exportFileName("json"),
      types: [{description: "StorySquish board", accept: {"application/json": [".json"]}}],
    });
  } catch (e) {
    if (e.name !== "AbortError") alertDialog(`Could not choose the file: ${e.message}`);
    return;
  }
  try {
    const target = {handle, name: handle.name, connected: true, lastModified: (await handle.getFile()).lastModified};
    await writeBoardFile(target, serializeBoard(board));
    linkedFile = target;
    await rememberHandle(handle);
    render();
  } catch (e) {
    alertDialog(`Could not save to ${handle.name}: ${e.message}`);
  }
}

async function unlinkFile() {
  linkedFile = null;
  try { localStorage.removeItem(FILE_KEY); } catch { /* best effort */ }
  try { await idb("handles", "readwrite", store => store.delete("board")); } catch { /* best effort */ }
  render();
}

// Browsers forget file permissions between visits, so reconnecting needs a
// click; until then edits are kept here and flagged as unsynced.
async function connectLinkedFile() {
  const target = linkedFile;
  if (!target) return;
  try {
    if (await target.handle.requestPermission({mode: "readwrite"}) !== "granted") return;
    const file = await target.handle.getFile();
    target.connected = true;
    const {unsynced} = readFileMeta();
    if (unsynced || saveState.kind === "pending") {
      if (saveState.kind === "pending") saveNow();
      else writeToLinkedFile(serializeBoard(board));
    } else if (file.lastModified !== target.lastModified) {
      target.lastModified = file.lastModified;
      writeFileMeta({lastModified: file.lastModified, unsynced: false});
      const loaded = parseBoard(await file.text());
      if (JSON.stringify(loaded) !== JSON.stringify(board)) replaceBoard(loaded, "reloaded");
    }
  } catch (e) {
    alertDialog(`Could not reconnect ${target.name}: ${e.message}`);
  }
  render();
}

async function restoreLinkedFile() {
  if (!FILE_ACCESS) return;
  let handle;
  try { handle = await idb("handles", "readonly", store => store.get("board")); } catch { return; }
  if (!handle) return;
  linkedFile = {handle, name: handle.name, connected: false, lastModified: readFileMeta().lastModified};
  if (await handle.queryPermission({mode: "readwrite"}) === "granted") await connectLinkedFile();
  render();
}

function needsBackupNudge() {
  if (linkedFile) return false;
  const hasWork = board.scenes.length > 0 || board.characters.length > 0;
  return hasWork && Date.now() - settings.lastExportAt > BACKUP_NUDGE_AFTER_MS;
}

function markDirty() {
  saveState = {kind: "pending"};
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, SAVE_DEBOUNCE_MS);
  render();
  offerRepoForNewBoard();
}

/* ---------- actions ---------- */

function undo() {
  const restored = history.undo(board);
  if (restored) restoreBoard(restored);
}

function redo() {
  const restored = history.redo(board);
  if (restored) restoreBoard(restored);
}

function restoreBoard(restored) {
  board = restored;
  const unlinked = followResetLink();
  saveNow();
  if (unlinked) startNewBoard();
}

// Saved but not yet changed, so the repository offer waits for a real edit.
function startNewBoard() {
  githubBackup.boardChanged = false;
  githubBackup.newBoard = true;
}

// Undoing a Reset brings back the story, so it gets its repository back too;
// redoing it unlinks again. A repository linked since then is left alone.
// Returns whether it unlinked.
function followResetLink() {
  const reset = githubBackup.resetLink;
  if (!reset) return false;
  const current = JSON.stringify(board);
  if (current === reset.before && !settings.githubRepo) {
    linkRepo(reset.repo);
    githubBackup.newBoard = false;
  } else if (current === reset.after && settings.githubRepo === reset.repo) {
    linkRepo(null);
    githubBackup.newBoard = false;
    return true;
  }
  return false;
}

function addScene() {
  selected = {kind: "scene", id: addSceneToBoard()};
  focusSceneTitle = true;
  saveNow();
}

function duplicateSelectedScene() {
  if (selected?.kind !== "scene") return;
  const copy = duplicateSceneOnBoard(selected.id);
  if (copy) { selected = {kind: "scene", id: copy}; saveNow(); }
}

function shiftSelection(offset) {
  if (!selected) return;
  const items = {scene: board.scenes, character: board.characters, location: board.locations}[selected.kind];
  if (shiftBy(items, selected.id, offset)) saveNow();
}

function deleteLocation(id) {
  deleteLocationFromBoard(id);
  if (isSelected("location", id)) selected = null;
  saveNow();
}

function deleteCharacter(id) {
  deleteCharacterFromBoard(id);
  if (isSelected("character", id)) selected = null;
  saveNow();
}

function confirmDeleteScene(id) {
  confirmDialog("Delete this scene?", () => {
    board.scenes = board.scenes.filter(s => s.id !== id);
    if (board.dayZero === id) board.dayZero = null;
    for (const character of board.characters) {
      if (character.arrivalScene === id) character.arrivalScene = null;
      if (character.deathScene === id) character.deathScene = null;
    }
    for (const item of board.items) {
      if (item.resolvedScene === id) item.resolvedScene = null;
    }
    if (isSelected("scene", id)) selected = null;
    saveNow();
  });
}

// The story's repository holds the story, not this browser's slot, so a
// Reset unlinks it; otherwise the next backup would overwrite it with the
// empty board. The first change then offers a repository, as on a first visit.
function confirmReset() {
  const repo = settings.githubRepo;
  const unlinkNote = repo ? ` This board stops backing up to ${repo}, which stays on GitHub.` : "";
  confirmDialog(`Delete ALL scenes, characters and locations?${unlinkNote} You can still undo this.`, () => {
    if (saveState.kind === "pending") saveNow();
    const before = JSON.stringify(board);
    board = defaultBoard();
    selected = null;
    githubBackup.newBoard = false;
    if (repo) {
      githubBackup.resetLink = {repo, before, after: JSON.stringify(board)};
      linkRepo(null);
    }
    saveNow();
    startNewBoard();
  });
}

function closeInspector() {
  selected = null;
  render();
}

function filtersActive() {
  return filters.query.trim() !== "" || filters.status !== "" || filters.act !== "" || filters.pov !== "";
}

// Deleting, resetting or undoing can remove the character a filter points
// at, which would otherwise hide every card.
function dropStalePovFilter() {
  if (filters.pov && !findCharacter(filters.pov)) filters.pov = "";
}

async function importBoard(file) {
  try {
    board = parseBoard(await file.text());
  } catch (e) {
    alertDialog(`Could not import: ${e.message}`);
    return;
  }
  selected = null;
  saveNow();
  if (saveState.kind === "saved") { saveState = {kind: "imported"}; render(); }
}

function exportBoard() {
  try {
    download(exportFileName("json"), serializeBoard(board), "application/json");
  } catch (e) {
    alertDialog(`Could not export: ${e.message}`);
    return;
  }
  settings.lastExportAt = Date.now();
  try { persistSettings(); } catch { /* the nudge just comes back */ }
  render();
}

function exportMarkdown(what, suffix, renderMarkdown) {
  try { download(exportFileName("md", suffix), renderMarkdown(board), "text/markdown"); }
  catch (e) { alertDialog(`Could not export ${what}: ${e.message}`); }
}

/* ---------- rendering ---------- */

function esc(value) {
  return String(value).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
}

function characterDisplayName(name) {
  return name.trim() ? name : "Unnamed";
}

function sceneTitle(scene) {
  return scene.title.trim() ? scene.title : "Untitled";
}

function formatCount(count) {
  return count.toLocaleString("en-US");
}

function words(count) {
  return `${formatCount(count)} word${count === 1 ? "" : "s"}`;
}

function preview(text) {
  const chars = Array.from(text);
  if (chars.length <= SUMMARY_PREVIEW_CHARS) return text;
  return chars.slice(0, SUMMARY_PREVIEW_CHARS).join("").trimEnd() + "…";
}

function plural(count, noun) {
  return `${count} ${noun}${count === 1 ? "" : "s"}`;
}

// Leaves a field alone while the user is typing in it, so re-rendering on
// every keystroke never moves the caret.
function syncValue(input, value) {
  if (document.activeElement !== input && input.value !== value) input.value = value;
}

function syncOptions(select, options, value) {
  const html = options.map(([v, label]) => `<option value="${esc(v)}">${esc(label)}</option>`).join("");
  if (select.dataset.options !== html) {
    select.innerHTML = html;
    select.dataset.options = html;
  }
  select.value = value;
}

function render() {
  dropStalePovFilter();
  renderHeader();
  renderFilters();
  renderCharacters();
  renderLocations();
  renderTabs();
  renderInspector();
  renderStats();
  const failed = saveState.kind === "failed" ? " (save failed)" : "";
  document.title = `${board.title.trim() || DEFAULT_TITLE} — StorySquish${failed}`;
}

function renderHeader() {
  syncValue($("bookTitle"), board.title);
  $("statsToggle").checked = showStats;
  const label = $("saveState");
  label.textContent = {
    saved: "saved", pending: "saving…", imported: "imported", reloaded: "reloaded", failed: "save failed",
  }[saveState.kind];
  label.classList.toggle("failed", saveState.kind === "failed");
  label.title = saveState.kind === "failed" ? saveState.reason
    : saveState.kind === "reloaded" ? "Picked up changes made to the board file elsewhere"
    : linkedFile?.connected ? `Saved in this browser and to ${linkedFile.name}`
    : "Saved in this browser";
  $("reconnectBtn").hidden = !linkedFile || linkedFile.connected;
  $("reconnectBtn").title = linkedFile ? `Allow this tab to read and write ${linkedFile.name} again` : "";
  $("backupNudge").hidden = !needsBackupNudge();
  $("undoBtn").disabled = !history.canUndo(board);
  $("redoBtn").disabled = !history.canRedo(board);
}

function renderFilters() {
  syncValue($("search"), filters.query);
  syncOptions($("filterStatus"), [["", "All"], ...STATUSES.map(s => [s, s])], filters.status);
  syncOptions($("filterAct"), [["", "All"], ...ACTS.map(a => [a, a])], filters.act);
  syncOptions($("filterPov"),
    [["", "All"], ...board.characters.map(c => [c.id, characterDisplayName(c.name)])], filters.pov);
  $("matchCount").textContent = plural(matchingIndices().length, "scene");
  $("clearFilters").hidden = !filtersActive();
}

function renderCharacters() {
  const list = $("charList");
  if (!board.characters.length) {
    list.innerHTML = '<div class="hint" style="margin-bottom:6px">No characters yet.</div>';
    return;
  }
  list.innerHTML = board.characters.map(c => `
    <div class="char${isSelected("character", c.id) ? " selected" : ""}" data-id="${esc(c.id)}">
      <div class="cname"><span>${esc(characterDisplayName(c.name))}</span><span class="x" title="Remove character">×</span></div>
      <div class="hint">${plural(povSceneCount(c.id), "POV scene")}</div>
      ${c.notes ? `<div class="cnotes">${esc(preview(c.notes))}</div>` : ""}
    </div>`).join("");
}

function renderLocations() {
  const list = $("locList");
  if (!board.locations.length) {
    list.innerHTML = '<div class="hint" style="margin-bottom:6px">No locations yet.</div>';
    return;
  }
  list.innerHTML = board.locations.map(l => `
    <div class="char${isSelected("location", l.id) ? " selected" : ""}" data-id="${esc(l.id)}">
      <div class="cname"><span>${esc(characterDisplayName(l.name))}</span></div>
      <div class="hint">${plural(locationSceneCount(l.id), "scene")}</div>
    </div>`).join("");
}

// Location, story day and word count: the parts that are set.
function sceneFootnote(scene, storyDay) {
  const parts = [];
  const location = findLocation(scene.location);
  if (location) parts.push(characterDisplayName(location.name));
  if (storyDay !== null) parts.push(storyDayLabel(storyDay));
  const count = wordCount(scene.text);
  if (count) parts.push(words(count));
  return parts.join(" · ");
}

function sceneDetails(scene) {
  const parts = [scene.status];
  const pov = findCharacter(scene.pov);
  if (pov) parts.push(`POV ${characterDisplayName(pov.name)}`);
  const location = findLocation(scene.location);
  if (location) parts.push(characterDisplayName(location.name));
  return parts.join(" · ");
}

function sceneCard(scene, index, place, storyDay) {
  const pov = findCharacter(scene.pov);
  const footnote = sceneFootnote(scene, storyDay);
  const classes = ["card"];
  if (isSelected("scene", scene.id)) classes.push("selected");
  if (dragFrom === index) classes.push("dragging");
  return `
    <div class="${classes.join(" ")}" draggable="true" data-index="${index}" data-id="${esc(scene.id)}">
      <div class="num">${sceneNumber(index)}${place?.starts ? ` · CHAPTER ${place.number}` : ""}</div>
      ${scene.title
        ? `<div class="ttl">${esc(scene.title)}</div>`
        : '<div class="ttl untitled">Untitled scene</div>'}
      <div class="sum">${esc(preview(scene.summary || "No summary yet."))}</div>
      <div class="badges">
        <span class="badge status-${scene.status}">${esc(scene.status)}</span>
        ${scene.act ? `<span class="badge act">${esc(scene.act)}</span>` : ""}
        ${pov ? `<span class="badge pov">${esc(characterDisplayName(pov.name))}</span>` : ""}
      </div>
      ${footnote ? `<div class="footnote">${esc(footnote)}</div>` : ""}
    </div>`;
}

const VIEWS = {board: renderBoard, write: renderWrite, timeline: renderTimeline, graph: renderGraph};

function renderTabs() {
  for (const tab of document.querySelectorAll(".tab")) {
    const active = tab.dataset.view === view;
    tab.classList.toggle("active", active);
    tab.setAttribute("aria-selected", String(active));
  }
  for (const name of Object.keys(VIEWS)) $(name).hidden = name !== view;
  VIEWS[view]();
}

function emptyState(heading, hint) {
  return `<div class="empty"><strong>${esc(heading)}</strong>${esc(hint)}</div>`;
}

function renderWrite() {
  const index = selected?.kind === "scene" ? sceneIndex(selected.id) : -1;
  const picker = $("writePicker");
  $("writeEditor").hidden = index < 0;
  picker.hidden = index >= 0;
  if (index < 0) {
    picker.innerHTML = board.scenes.length
      ? `<h2>Pick a scene to write</h2>${board.scenes.map((scene, i) =>
          `<button class="link" data-id="${esc(scene.id)}">${sceneNumber(i)}  ${esc(sceneTitle(scene))}</button>`).join("")}`
      : emptyState("No scenes yet", "Add a scene, then write its prose here.");
    return;
  }
  const scene = board.scenes[index];
  const place = chapters()[index];
  $("wHeading").textContent = `${place ? `Chapter ${place.number} · ` : ""}${sceneNumber(index)}  ${sceneTitle(scene)}`;
  $("wPrev").disabled = index === 0;
  $("wNext").disabled = index === board.scenes.length - 1;
  const manuscript = board.wordGoal === null
    ? `${formatCount(manuscriptWordCount())} in manuscript`
    : `${formatCount(manuscriptWordCount())} / ${formatCount(board.wordGoal)} goal in manuscript`;
  $("wWords").textContent = `${words(wordCount(scene.text))} · ${manuscript}`;
  $("wSummary").textContent = scene.summary.trim();
  syncValue($("prose"), scene.text);
}

function timelineRow(index) {
  const scene = board.scenes[index];
  return `<div class="trow${isSelected("scene", scene.id) ? " selected" : ""}" data-id="${esc(scene.id)}">
    <span class="num">${sceneNumber(index)}</span>
    <strong>${esc(sceneTitle(scene))}</strong>
    <span class="hint">${esc(sceneDetails(scene))}</span>
  </div>`;
}

function renderTimeline() {
  const host = $("timeline");
  const dated = chronologicalIndices();
  const undated = sceneGaps().day;
  const days = storyDays();
  if (!dated.length && !undated.length) {
    host.innerHTML = emptyState("No scenes yet", "Scenes with a story day appear here in story order.");
    return;
  }
  let html = dated.length ? "" : '<p class="hint">Set a story day or date on scenes in the inspector to see them in story order, flashbacks included.</p>';
  let currentHeading = null;
  for (const index of dated) {
    const heading = storyDayLabel(days[index]).toUpperCase();
    if (heading !== currentHeading) {
      currentHeading = heading;
      html += `<div class="day-heading">${esc(heading)}</div>`;
    }
    html += timelineRow(index);
  }
  if (undated.length) html += `<div class="day-heading" style="margin-top:20px">UNDATED</div>${undated.map(timelineRow).join("")}`;
  host.innerHTML = html;
}

const NODE_RADIUS = 26;
// Short of the midpoint, so the labels of A→B and B→A land apart.
const LABEL_POSITION = 0.4;
const SVG_NS = "http://www.w3.org/2000/svg";

function renderGraph() {
  const host = $("graph");
  const characters = board.characters;
  if (characters.length < 2) {
    host.innerHTML = emptyState("Not enough characters", "Add at least two characters to map how they relate.");
    return;
  }
  const width = Math.max(host.clientWidth, 320);
  const hint = board.relationships.length ? ""
    : '<p class="hint graph-hint">Select a character and add relationships in the inspector.</p>';
  const height = Math.max(host.clientHeight - (hint ? 40 : 0), 320);
  const center = {x: width / 2, y: height / 2};
  const ring = Math.max(Math.min(width, height) / 2 - NODE_RADIUS - 24, NODE_RADIUS);
  const positions = new Map(characters.map((c, i) => {
    const angle = (2 * Math.PI * i) / characters.length - Math.PI / 2;
    return [c.id, {x: center.x + ring * Math.cos(angle), y: center.y + ring * Math.sin(angle)}];
  }));

  let edges = "";
  for (const relationship of board.relationships) {
    const from = positions.get(relationship.from);
    const to = positions.get(relationship.to);
    if (!from || !to) continue;
    const length = Math.hypot(to.x - from.x, to.y - from.y) || 1;
    const dir = {x: (to.x - from.x) / length, y: (to.y - from.y) / length};
    // Offsetting sideways keeps A→B and B→A from drawing on top of each other.
    const side = {x: -dir.y * 6, y: dir.x * 6};
    const start = {x: from.x + dir.x * NODE_RADIUS + side.x, y: from.y + dir.y * NODE_RADIUS + side.y};
    const tip = {x: to.x - dir.x * (NODE_RADIUS + 2) + side.x, y: to.y - dir.y * (NODE_RADIUS + 2) + side.y};
    const wing = (sign) => `${tip.x - dir.x * 9 + sign * -dir.y * 5},${tip.y - dir.y * 9 + sign * dir.x * 5}`;
    edges += `<line class="edge" x1="${start.x}" y1="${start.y}" x2="${tip.x}" y2="${tip.y}"/>`;
    edges += `<polyline class="edge" points="${wing(1)} ${tip.x},${tip.y} ${wing(-1)}"/>`;
    const label = relationship.label.trim();
    if (label) {
      edges += `<text class="edge-label" text-anchor="middle" dominant-baseline="middle"
        x="${start.x + (tip.x - start.x) * LABEL_POSITION + side.x * 1.5}"
        y="${start.y + (tip.y - start.y) * LABEL_POSITION + side.y * 1.5}">${esc(label)}</text>`;
    }
  }

  const nodes = characters.map(c => {
    const {x, y} = positions.get(c.id);
    const name = characterDisplayName(c.name);
    const initials = name.split(/\s+/).filter(Boolean).slice(0, 2).map(w => Array.from(w)[0]).join("");
    return `<g class="node${isSelected("character", c.id) ? " selected" : ""}" data-id="${esc(c.id)}"
        tabindex="0" role="button" aria-label="${esc(name)}">
      <circle cx="${x}" cy="${y}" r="${NODE_RADIUS}"/>
      <text class="initials" x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central" font-size="15">${esc(initials)}</text>
      <text x="${x}" y="${y + NODE_RADIUS + 14}" text-anchor="middle" font-size="12">${esc(name)}</text>
    </g>`;
  }).join("");

  host.innerHTML = `${hint}<svg xmlns="${SVG_NS}" viewBox="0 0 ${width} ${height}" role="img"
    aria-label="Character relationships">${edges}${nodes}</svg>`;
}

function renderBoard() {
  const host = $("board");
  if (!board.scenes.length) {
    host.innerHTML = '<div class="empty"><strong>No scenes yet</strong>Click “+ Scene” to pin your first index card.</div>';
    return;
  }
  const indices = matchingIndices();
  if (!indices.length) {
    host.innerHTML = '<div class="empty"><strong>No matching scenes</strong>Clear the search or filters to show cards.</div>';
    return;
  }
  const places = chapters();
  const days = storyDays();
  host.innerHTML = `<div class="grid">${indices.map(i => sceneCard(board.scenes[i], i, places[i], days[i])).join("")}</div>`;
}

function renderInspector() {
  const panel = $("inspector");
  if (selected?.kind === "scene" && sceneIndex(selected.id) < 0) selected = null;
  if (selected?.kind === "character" && characterIndex(selected.id) < 0) selected = null;
  if (selected?.kind === "location" && locationIndex(selected.id) < 0) selected = null;
  panel.hidden = !selected;
  if (!selected) return;

  $("sceneInspector").hidden = selected.kind !== "scene";
  $("characterInspector").hidden = selected.kind !== "character";
  $("locationInspector").hidden = selected.kind !== "location";
  ({scene: renderSceneInspector, character: renderCharacterInspector, location: renderLocationInspector})[selected.kind]();
}

function renderSceneInspector() {
  const index = sceneIndex(selected.id);
  const scene = board.scenes[index];
  $("sNum").textContent = sceneNumber(index);
  $("sHeading").textContent = scene.title || "Untitled";
  syncValue($("sTitle"), scene.title);
  syncValue($("sSum"), scene.summary);
  syncOptions($("sStatus"), STATUSES.map(s => [s, s]), scene.status);
  syncOptions($("sPov"),
    [["", NONE_LABEL], ...board.characters.map(c => [c.id, characterDisplayName(c.name)])], scene.pov);
  syncOptions($("sAct"), [["", NONE_LABEL], ...ACTS.map(a => [a, a])], scene.act);
  syncOptions($("sLocation"),
    [["", NONE_LABEL], ...board.locations.map(l => [l.id, characterDisplayName(l.name)])], scene.location);
  const storyDay = storyDays()[index];
  $("sDayLabel").textContent = board.calendar ? "Story date" : "Story day";
  $("sDated").checked = (board.calendar ? shownDate(scene) : shownDay(scene)) !== null;
  const dayNumber = board.calendar ? storyDay?.number ?? null : shownDay(scene);
  $("sDay").hidden = dayNumber === null;
  syncValue($("sDay"), dayNumber === null ? "" : String(dayNumber));
  $("sDay").title = board.calendar ? "Changing the day moves the scene's date to match" : "";
  $("sToday").hidden = !board.calendar || shownDate(scene) === null;
  $("sDayZeroField").hidden = !$("sDated").checked;
  $("sDayZero").checked = board.dayZero === scene.id;
  const place = chapters()[index];
  $("sChapterBreak").checked = scene.chapterBreak;
  $("sChapterLabel").textContent = place?.starts ? `Starts a chapter (chapter ${place.number})` : "Starts a chapter";
  $("sDate").hidden = !board.calendar || shownDate(scene) === null;
  syncValue($("sDate"), scene.date ?? "");
  $("sWords").textContent = words(wordCount(scene.text));
  $("sWrite").hidden = view === "write";
  $("sEarlier").disabled = index === 0;
  $("sLater").disabled = index === board.scenes.length - 1;
  if (focusSceneTitle) {
    focusSceneTitle = false;
    $("sTitle").focus();
  }
}

function renderCharacterInspector() {
  const index = characterIndex(selected.id);
  const character = board.characters[index];
  $("cHeading").textContent = characterDisplayName(character.name);
  syncValue($("cName"), character.name);
  syncValue($("cRole"), character.role);
  syncValue($("cGender"), character.gender);
  syncValue($("cGoal"), character.goal);
  syncValue($("cNotes"), character.notes);
  $("cPovCount").textContent = `POV in ${plural(povSceneCount(character.id), "scene")}`;
  const appearances = characterAppearances().find(([c]) => c.id === character.id)?.[1] ?? [];
  $("cAppearCount").textContent = `Appears in ${plural(appearances.length, "scene")}`;
  $("cUp").disabled = index === 0;
  $("cDown").disabled = index === board.characters.length - 1;
  renderRelationshipEditor(character);
}

// Rows are rebuilt only when the set of relationships changes, so typing a
// label never loses the caret.
function renderRelationshipEditor(character) {
  const rows = board.relationships
    .filter(r => r.from === character.id || r.to === character.id)
    .map(r => {
      const outgoing = r.from === character.id;
      const other = findCharacter(outgoing ? r.to : r.from);
      const reversible = !hasRelationship(r.to, r.from);
      return {r, reversible, text: `${outgoing ? "to" : "from"} ${characterDisplayName(other?.name ?? "")}`};
    });
  const list = $("relList");
  const signature = rows.map(({r, reversible, text}) => `${r.id}:${reversible}:${text}`).join("|") || "none";
  if (list.dataset.signature !== signature) {
    list.dataset.signature = signature;
    list.innerHTML = rows.length
      ? rows.map(({r, reversible, text}) => `<div class="rel-row" data-id="${esc(r.id)}">
          <span>${esc(text)}</span>
          <input class="rel-label" placeholder="how they relate" aria-label="${esc(`Relationship ${text}`)}">
          ${reversible ? '<button class="rel-reverse" title="Add a relationship pointing the other way">Add reverse</button>' : ""}
          <button class="icon rel-remove" title="Remove relationship">×</button>
        </div>`).join("")
      : '<div class="hint">None yet.</div>';
  }
  for (const {r} of rows) syncValue(list.querySelector(`[data-id="${CSS.escape(r.id)}"] input`), r.label);

  const others = board.characters.filter(c => c.id !== character.id);
  $("relAdd").hidden = !others.length;
  const target = $("relTarget");
  const keep = others.some(c => c.id === target.value) ? target.value : "";
  syncOptions(target, [["", "Character…"], ...others.map(c => [c.id, characterDisplayName(c.name)])], keep);
  $("relAddBtn").disabled = !keep;
}

function renderLocationInspector() {
  const index = locationIndex(selected.id);
  const location = board.locations[index];
  $("lHeading").textContent = characterDisplayName(location.name);
  syncValue($("lName"), location.name);
  syncValue($("lNotes"), location.notes);
  $("lCount").textContent = `Setting of ${plural(locationSceneCount(location.id), "scene")}`;
  $("lUp").disabled = index === 0;
  $("lDown").disabled = index === board.locations.length - 1;
}

function renderStats() {
  $("stats").hidden = !showStats;
  if (!showStats) return;
  const rows = [
    ...STATUSES.map(s => [s, board.scenes.filter(sc => sc.status === s).length]),
    ...ACTS.map(a => [a, board.scenes.filter(sc => sc.act === a).length]),
  ];
  $("statsBody").innerHTML =
    rows.map(([label, count]) => `<tr><td>${esc(label)}</td><td>${count}</td></tr>`).join("") +
    `<tr class="total"><td>Total</td><td>${board.scenes.length}</td></tr>` +
    (chapterCount() > 0 ? `<tr><td>Chapters</td><td>${chapterCount()}</td></tr>` : "") +
    `<tr><td>Words</td><td>${wordsAgainstGoal()}</td></tr>`;

  const total = manuscriptWordCount();
  const shareRow = (label, count) =>
    `<tr><td>${esc(label)}</td><td class="num">${formatCount(count)}</td><td class="num">${percent(count, total).toFixed(0)}%</td></tr>`;

  $("statsActWords").innerHTML = actWordCounts()
    .filter(([act, count]) => act || count > 0)
    .map(([act, count]) => shareRow(act || "No act", count))
    .join("");

  const POV_SHOWN = 7;
  const pov = povWordCounts();
  const rest = pov.slice(POV_SHOWN);
  $("statsPovWords").innerHTML = pov.length === 0
    ? `<tr><td class="none">No POV scenes yet.</td></tr>`
    : pov.slice(0, POV_SHOWN).map(([c, count]) => shareRow(characterDisplayName(c.name), count)).join("") +
      (rest.length ? shareRow(`${rest.length} more`, rest.reduce((sum, [, count]) => sum + count, 0)) : "");

  const gaps = sceneGaps();
  const APPEAR_SHOWN = 7;
  const appearances = characterAppearances();
  const present = appearances.filter(([, scenes]) => scenes.length > 0).sort((a, b) => b[1].length - a[1].length);
  const absent = appearances.filter(([, scenes]) => scenes.length === 0);
  $("statsAppearances").innerHTML = appearances.length === 0
    ? `<tr><td class="none">No characters yet.</td></tr>`
    : present.slice(0, APPEAR_SHOWN).map(([c, scenes]) =>
        `<tr><td>${esc(characterDisplayName(c.name))}</td><td class="num" title="${esc(sceneList(scenes))}">${scenes.length}</td></tr>`).join("") +
      (present.length > APPEAR_SHOWN ? `<tr><td>${present.length - APPEAR_SHOWN} more</td></tr>` : "") +
      (absent.length ? `<tr><td>Never appear</td><td class="num gap" title="${esc(absent.map(([c]) => characterDisplayName(c.name)).join("\n"))}">${absent.length}</td></tr>` : "");

  $("statsGaps").innerHTML = [["No POV", gaps.pov], ["No location", gaps.location], ["No day", gaps.day]]
    .map(([label, indices]) => indices.length === 0
      ? `<tr><td>${label}</td><td class="num none">0</td></tr>`
      : `<tr><td>${label}</td><td class="num gap" title="${esc(sceneList(indices))}">${indices.length}</td></tr>`)
    .join("");
}

function wordsAgainstGoal() {
  const count = manuscriptWordCount();
  if (board.wordGoal === null) return formatCount(count);
  const pct = Math.min(percent(count, board.wordGoal), 999);
  return `${formatCount(count)} / ${formatCount(board.wordGoal)} (${pct.toFixed(0)}%)`;
}

function percent(part, whole) {
  return whole === 0 ? 0 : part / whole * 100;
}

function sceneList(indices) {
  const SHOWN = 12;
  const lines = indices.slice(0, SHOWN).map(i => `${sceneNumber(i)}  ${sceneTitle(board.scenes[i])}`);
  if (indices.length > SHOWN) lines.push(`…and ${indices.length - SHOWN} more`);
  return lines.join("\n");
}

/* ---------- dialogs ---------- */

function modalOpen() {
  return modalStack.length > 0;
}

function openModal(dialog) {
  modalStack.push(dialog);
  drawModal();
}

function closeModal() {
  modalStack.pop();
  drawModal();
}

function dismissModal() {
  const top = modalStack.at(-1);
  if (!top) return;
  closeModal();
  top.onDismiss?.();
}

let drawnModal = null;

function drawModal() {
  const host = $("modalHost");
  const top = modalStack.at(-1);
  const keptScroll = top && top === drawnModal ? host.firstElementChild?.scrollTop ?? 0 : 0;
  host.replaceChildren();
  host.hidden = !top;
  drawnModal = top ?? null;
  if (!top) return;
  const box = document.createElement("div");
  box.className = "modal";
  box.setAttribute("role", "dialog");
  box.setAttribute("aria-modal", "true");
  host.append(box);
  top.draw(box);
  box.scrollTop = keptScroll;
}

function button(label, className, onClick) {
  const b = document.createElement("button");
  b.textContent = label;
  if (className) b.className = className;
  b.addEventListener("click", onClick);
  return b;
}

function message(text) {
  const p = document.createElement("p");
  p.className = "message";
  p.textContent = text;
  return p;
}

function alertDialog(text) {
  openModal({
    draw(box) {
      const ok = button("OK", "", closeModal);
      box.append(message(text), ok);
      ok.focus();
    },
  });
}

function confirmDialog(prompt, onAccept) {
  openModal({
    draw(box) {
      const actions = document.createElement("div");
      actions.className = "row";
      const cancel = button("Cancel", "", closeModal);
      actions.append(button("Delete", "danger", () => { closeModal(); onAccept(); }), cancel);
      box.append(message(prompt), actions);
      cancel.focus();
    },
  });
}

function settingsDialog() {
  openModal({
    draw(box) {
      const heading = document.createElement("h2");
      heading.textContent = "Settings";
      const label = document.createElement("label");
      label.className = "field-label";
      label.htmlFor = "schemeSelect";
      label.textContent = "Color scheme";
      const picker = document.createElement("div");
      picker.className = "scheme-picker";
      const swatch = schemeSwatch(schemeByKey(settings.colorScheme));
      const select = document.createElement("select");
      select.id = "schemeSelect";
      for (const scheme of COLOR_SCHEMES) select.add(new Option(scheme.name, scheme.key));
      select.value = settings.colorScheme;
      select.addEventListener("change", () => {
        setColorScheme(select.value);
        drawModal();
        document.getElementById("schemeSelect")?.focus();
      });
      picker.append(swatch, select);
      const status = hint(settingsSaveError ?? "Saved in this browser's storage.");
      if (settingsSaveError) status.style.color = "var(--danger)";
      box.append(heading, label, picker, status, ...boardFileSection(), ...wordGoalSection(), ...storyCalendarSection(), ...backupSection(), ...githubSection(),
        button("Close", "", closeModal));
      box.style.maxWidth = "420px";
    },
  });
}

function schemeSwatch(scheme) {
  const swatch = document.createElement("span");
  swatch.className = "swatch";
  for (const fill of [scheme.header, scheme.board, scheme.card, scheme.accent]) {
    const stripe = document.createElement("span");
    stripe.style.background = fill;
    swatch.append(stripe);
  }
  return swatch;
}

function hint(text) {
  const div = document.createElement("div");
  div.className = "hint";
  div.style.margin = "6px 0";
  div.textContent = text;
  return div;
}

function fieldLabel(text) {
  const div = document.createElement("div");
  div.className = "field-label";
  div.textContent = text;
  return div;
}

function row(...children) {
  const div = document.createElement("div");
  div.className = "row";
  div.append(...children);
  return div;
}

function boardFileSection() {
  const label = fieldLabel("Board file");
  if (!FILE_ACCESS) {
    return [label, hint("This browser can only keep the board in its own storage. To keep it in a file " +
      "(and use it on several computers through iCloud Drive, Dropbox, OneDrive or Syncthing), use " +
      "Chrome or Edge on a desktop, or the desktop app. Otherwise, export a copy regularly.")];
  }
  const afterAction = action => async () => { await action(); drawModal(); };
  if (!linkedFile) {
    return [label,
      hint("Kept only in this browser. Link a file so the board survives clearing browser data and can " +
        "be used on several computers through a synced folder (iCloud Drive, Dropbox, OneDrive, Syncthing)."),
      row(button("Save to file…", "", afterAction(saveToLinkedFile)), button("Open file…", "", afterAction(openLinkedFile)))];
  }
  const state = linkedFile.connected
    ? `Every change is saved to ${linkedFile.name}; changes synced in from elsewhere load automatically.`
    : `Linked to ${linkedFile.name}, but this tab needs permission again. Edits are kept here until then.`;
  return [label, hint(state), row(
    ...(linkedFile.connected ? [] : [button("Reconnect", "primary", afterAction(connectLinkedFile))]),
    button("Open other…", "", afterAction(openLinkedFile)),
