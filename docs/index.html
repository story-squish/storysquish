<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Untitled Novel — StorySquish</title>
<meta name="theme-color" content="#3a2c1e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{
    --board:#c9b79c;--header:#3a2c1e;--header-text:#f4ead6;--ink:#2b2118;--muted:#7a6a52;--card:#fdfaf2;
    --line:#d8cdb6;--sidebar:#f2ecdd;--inspector:#faf6ec;--accent:#8a5a2b;--on-accent:#fff;--danger:#b04030;
    --act:#cfe0e8;--field:#fff;
    --status-Outline:#cfe0e8;--status-Draft:#e8dcc0;--status-Revision:#f3e0c0;--status-Final:#d5ecd0;--status-Archived:#e2e2e2;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100%}
  body{margin:0;font:14px/1.45 "Segoe UI",system-ui,sans-serif;background:var(--board);color:var(--ink);display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--header);color:var(--header-text);flex-wrap:wrap}
  header h1{font-size:17px;margin:0 4px 0 0;font-weight:700;white-space:nowrap}
  header .grow{flex:1}
  #bookTitle{width:min(360px,40vw)}
  .toggle{display:flex;align-items:center;gap:4px;font-size:13px;cursor:pointer}
  .toggle input{width:auto;margin:0}
  button{cursor:pointer;border:1px solid var(--line);border-radius:6px;padding:6px 12px;font:inherit;font-size:13px;background:var(--card);color:var(--ink)}
  button:hover:not(:disabled){filter:brightness(.95)}
  button:disabled{opacity:.45;cursor:default}
  button.primary{background:var(--accent);color:var(--on-accent);border-color:transparent}
  button.danger{background:var(--danger);color:#fff;border-color:transparent}
  button.small{padding:2px 8px;font-size:12px}
  button.icon{padding:0 8px;font-size:16px;line-height:24px}
  .save-state{font-size:11px;opacity:.8;margin-right:4px}
  .save-state.failed{color:#ff9a8a;opacity:1;cursor:help}
  main{flex:1;display:flex;min-height:0}
  #sidebar{width:250px;flex:none;background:var(--sidebar);border-right:1px solid var(--line);padding:16px;overflow:auto}
  #center{flex:1;display:flex;flex-direction:column;min-width:0}
  #tabs{display:flex;gap:4px;padding:12px 22px 0;flex-wrap:wrap}
  .tab{background:transparent;border-color:transparent}
  .tab.active{background:var(--card);border-color:var(--line);font-weight:700}
  .view{flex:1;overflow:auto;padding:16px 22px 22px;min-height:0}
  #write:not([hidden]){display:flex;flex-direction:column}
  #writeEditor:not([hidden]){flex:1;display:flex;flex-direction:column;gap:6px;min-height:0}
  #writeEditor .row{margin:0}
  #wHeading{font-weight:700}
  #wSummary{font-style:italic}
  #prose{flex:1;min-height:320px;font:16px/1.6 Georgia,"Times New Roman",serif;padding:14px;background:var(--card);resize:none}
  .link{background:none;border:0;padding:2px 0;color:var(--accent);text-decoration:underline;display:block;text-align:left}
  .day-heading{font-size:12px;font-weight:700;letter-spacing:.5px;color:var(--muted);margin:12px 0 4px}
  .trow{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:6px 10px;margin-bottom:4px;cursor:pointer;max-width:720px}
  .trow.selected{border:2px solid var(--accent);padding:5px 9px}
  #graph{padding:0;overflow:hidden}
  #graph .graph-hint{padding:16px 22px 0}
  #graph svg{display:block;width:100%;height:100%}
  #graph .node{cursor:pointer}
  #graph .node circle{fill:var(--card);stroke:var(--line)}
  #graph .node text{fill:var(--ink)}
  #graph .node:is(:hover,:focus,.selected) circle{fill:var(--accent)}
  #graph .node:is(:hover,:focus,.selected) .initials{fill:var(--on-accent)}
  #graph .node:focus{outline:none}
  #graph .edge{stroke:var(--muted);stroke-width:1.5;fill:none}
  #graph .edge-label{fill:var(--ink);font-size:12px;paint-order:stroke;stroke:var(--board);stroke-width:5px;stroke-linejoin:round}
  .footnote{font-size:11px;color:var(--muted);margin-top:6px}
  .day-field{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .day-field input[type=date]{width:auto}
  .day-field input[type=checkbox]{width:auto;margin:0}
  .check-field{display:flex;gap:6px;align-items:center;margin-top:8px;cursor:pointer}
  .check-field input{width:auto;margin:0}
  .rel-row{display:flex;gap:6px;align-items:center;margin-top:4px}
  .rel-row > span{white-space:nowrap}
  .rel-row input{flex:1;min-width:0}
  .rel-row select{width:110px;flex:none}
  .rel-row .rel-reverse{white-space:nowrap;flex:none}
  details.menu{position:relative}
  details.menu > summary{list-style:none;cursor:pointer;border:1px solid var(--line);border-radius:6px;padding:6px 12px;font-size:13px;background:var(--card);color:var(--ink)}
  details.menu > summary::-webkit-details-marker{display:none}
  .menu-items{position:absolute;right:0;top:calc(100% + 4px);z-index:5;display:flex;flex-direction:column;gap:2px;background:var(--inspector);border:1px solid var(--line);border-radius:6px;padding:4px;box-shadow:0 6px 16px #0003;min-width:190px}
  .menu-items button{text-align:left;border-color:transparent;background:transparent}
  button.warn{background:#e8b04a;color:#2b2118;border-color:transparent}
  .backup-list{display:flex;flex-direction:column;gap:2px;max-height:50vh;overflow:auto;margin-bottom:12px}
  .backup-list button{text-align:left}
  .modal input.repo-input{flex:1;min-width:0}
  #inspector{width:340px;flex:none;background:var(--inspector);border-left:1px solid var(--line);padding:16px;overflow:auto}
  #stats{background:var(--inspector);border-top:1px solid var(--line);padding:12px}
  h2{margin:0 0 6px;font-size:16px}
  .section + .section{margin-top:18px}
  .field-label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin:10px 0 4px}
  input,textarea,select{width:100%;font:inherit;padding:6px 9px;border:1px solid var(--line);border-radius:6px;background:var(--field);color:var(--ink)}
  textarea{resize:vertical}
  .hint{font-size:12px;color:var(--muted)}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
  .add-form{display:flex;gap:6px}
  .add-form input{flex:1;min-width:0}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:16px;align-items:start}
  .card{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:12px;box-shadow:0 3px 6px #0001;cursor:pointer;min-height:90px;user-select:none}
  .card.selected,.char.selected{border:2px solid var(--accent)}
  .card.selected{padding:11px}
  .card.dragging{opacity:.4}
  .card.drop-target{outline:2px solid var(--accent);outline-offset:4px}
  .num{font-size:11px;font-weight:700;letter-spacing:1px;color:var(--muted)}
  .card .ttl{font-weight:700;margin:2px 0 4px;overflow-wrap:anywhere}
  .card .ttl.untitled{font-weight:400;font-style:italic}
  .card .sum{font-size:12px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}
  .badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .badge{font-size:10px;padding:2px 7px;border-radius:10px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;color:var(--ink)}
  .badge.act{background:var(--act)}
  .badge.pov{background:var(--header);color:var(--header-text)}
  .status-Outline{background:var(--status-Outline)}
  .status-Draft{background:var(--status-Draft)}
  .status-Revision{background:var(--status-Revision)}
  .status-Final{background:var(--status-Final)}
  .status-Archived{background:var(--status-Archived)}
  .empty{text-align:center;padding:60px 20px}
  .empty strong{display:block;font-size:20px;margin-bottom:4px}
  .char{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:8px 10px;margin-bottom:6px;cursor:pointer;box-shadow:0 3px 6px #0001}
  .char.selected{padding:7px 9px}
  .char .cname{display:flex;justify-content:space-between;gap:6px;font-weight:700;overflow-wrap:anywhere}
  .char .x{color:var(--danger);font-weight:700;cursor:pointer;padding:0 2px}
  .char .cnotes{font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:2px}
  .insp-head{display:flex;align-items:center;gap:8px}
  .insp-head .ttl{font-weight:700;flex:1;overflow-wrap:anywhere}
  .stats-table{border-collapse:collapse}
  .stats-table td{padding:2px 12px 2px 0}
  .stats-table tr.total td{font-weight:700}
  .stats-grid{display:flex;flex-wrap:wrap;gap:12px 32px;align-items:flex-start}
  .stats-grid h3{font-size:13px;margin:0 0 4px}
  .stats-table td.num{text-align:right}
  .stats-table td.gap{color:var(--danger);cursor:help}
  .stats-table td.none{color:var(--muted)}
  #modalHost{position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
  .modal{background:var(--inspector);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:16px;max-width:380px;width:100%;max-height:100%;overflow-y:auto;overscroll-behavior:contain;box-shadow:0 10px 30px #0005}
  .modal .message{white-space:pre-wrap;overflow-wrap:anywhere;margin:0 0 12px}
  .swatch{display:inline-flex;border:1px solid var(--line);flex:none}
  .swatch span{width:10px;height:14px}
  .scheme-picker{display:flex;align-items:center;gap:8px}
  .scheme-picker select{flex:1;min-width:0}
  @media (max-width:760px){
    main{flex-direction:column;overflow:auto}
    #sidebar,#inspector{width:auto;border:0;overflow:visible}
    .view{overflow:visible;padding:16px}
    #graph{height:70vh}
    #bookTitle{width:100%}
  }
</style>
</head>
<body>
<header>
  <h1>Manuscript Board</h1>
  <input id="bookTitle" placeholder="Novel title" aria-label="Novel title">
  <label class="toggle"><input type="checkbox" id="statsToggle"> Stats</label>
  <button id="settingsBtn">Settings</button>
  <span class="grow"></span>
  <span class="save-state" id="saveState">saved</span>
  <button class="warn" id="reconnectBtn" hidden>Reconnect file</button>
  <button class="warn" id="backupNudge" hidden title="This board only lives in this browser. Download a copy, or link a file in Settings.">Back up</button>
  <details class="menu" id="exportMenu">
    <summary>Export</summary>
    <div class="menu-items">
      <button data-export="board">Board (JSON)</button>
      <button data-export="outline">Outline (Markdown)</button>
      <button data-export="manuscript" title="The prose of every scene, for a word processor">Manuscript (Markdown)</button>
      <button data-export="combined" title="The outline followed by the manuscript, in one file">Outline + Manuscript (Markdown)</button>
    </div>
  </details>
  <button id="importBtn">Import</button>
  <button id="resetBtn">Reset</button>
  <button id="undoBtn">Undo</button>
  <button id="redoBtn">Redo</button>
  <button class="primary" id="addBtn">+ Scene</button>
  <input type="file" id="importFile" accept="application/json,.json" hidden>
</header>

<main>
  <aside id="sidebar">
    <div class="section">
      <h2>Filter</h2>
      <input id="search" placeholder="Search scenes, prose, POV, location" aria-label="Search">
      <label class="field-label" for="filterStatus">Status</label>
      <select id="filterStatus"></select>
      <label class="field-label" for="filterAct">Act</label>
      <select id="filterAct"></select>
      <label class="field-label" for="filterPov">POV</label>
      <select id="filterPov"></select>
      <div class="row">
        <span class="hint" id="matchCount"></span>
        <button class="small" id="clearFilters">Clear filters</button>
      </div>
    </div>
    <div class="section">
      <h2>Characters</h2>
      <div id="charList"></div>
      <form class="add-form" id="newCharForm">
        <input id="newChar" placeholder="New character name" aria-label="New character name" enterkeyhint="done" autocomplete="off">
        <button type="submit">Add</button>
      </form>
      <div class="hint">Type a name + Enter or Add.</div>
    </div>
    <div class="section">
      <h2>Locations</h2>
      <div id="locList"></div>
      <form class="add-form" id="newLocForm">
        <input id="newLoc" placeholder="New location name" aria-label="New location name" enterkeyhint="done" autocomplete="off">
        <button type="submit">Add</button>
      </form>
    </div>
  </aside>

  <div id="center">
    <nav id="tabs" role="tablist">
      <button class="tab" role="tab" data-view="board">Board</button>
      <button class="tab" role="tab" data-view="write">Write</button>
      <button class="tab" role="tab" data-view="timeline">Timeline</button>
      <button class="tab" role="tab" data-view="graph">Relationships</button>
    </nav>
    <section id="board" class="view"></section>
    <section id="write" class="view" hidden>
      <div id="writePicker"></div>
      <div id="writeEditor">
        <div class="row">
          <button id="wPrev">Previous</button>
          <span id="wHeading"></span>
          <button id="wNext">Next</button>
          <span class="grow" style="flex:1"></span>
          <span class="hint" id="wWords"></span>
        </div>
        <div class="hint" id="wSummary"></div>
        <textarea id="prose" aria-labelledby="wHeading" placeholder="Start writing…"></textarea>
      </div>
    </section>
    <section id="timeline" class="view" hidden></section>
    <section id="graph" class="view" hidden></section>
    <section id="stats" hidden>
      <h2>Statistics</h2>
      <div class="stats-grid">
        <table class="stats-table"><tbody id="statsBody"></tbody></table>
        <div><h3>Words per act</h3><table class="stats-table"><tbody id="statsActWords"></tbody></table></div>
        <div><h3>POV share</h3><table class="stats-table"><tbody id="statsPovWords"></tbody></table></div>
        <div><h3 title="Scenes where a character is POV or named in the title, summary or prose">Appearances</h3><table class="stats-table"><tbody id="statsAppearances"></tbody></table></div>
        <div><h3>Missing</h3><table class="stats-table"><tbody id="statsGaps"></tbody></table></div>
      </div>
    </section>
  </div>

  <aside id="inspector" hidden>
    <div id="sceneInspector">
      <div class="insp-head">
        <span class="num" id="sNum"></span>
        <span class="ttl" id="sHeading"></span>
        <button class="icon" id="sClose" title="Close">×</button>
      </div>
      <label class="field-label" for="sTitle">Title</label>
      <input id="sTitle" placeholder="e.g. The confrontation in the rain">
      <label class="field-label" for="sSum">Summary / beat</label>
      <textarea id="sSum" rows="5" placeholder="What happens in this scene. What changes."></textarea>
      <div class="cols">
        <div>
          <label class="field-label" for="sStatus">Status</label>
          <select id="sStatus"></select>
        </div>
        <div>
          <label class="field-label" for="sPov">POV character</label>
          <select id="sPov"></select>
        </div>
      </div>
      <label class="field-label" for="sAct">Act</label>
      <select id="sAct"></select>
      <div class="cols">
        <div>
          <label class="field-label" for="sLocation">Location</label>
          <select id="sLocation"></select>
        </div>
        <div>
          <label class="field-label" for="sDated" id="sDayLabel">Story day</label>
          <div class="day-field">
            <input type="checkbox" id="sDated" title="Place this scene on the timeline">
            <input type="number" id="sDay" step="1" aria-label="Story day">
            <input type="date" id="sDate" min="0001-01-01" max="9999-12-31" aria-label="Story date" hidden>
            <button class="small" id="sToday" title="Set the scene's date to today" hidden>Today</button>
          </div>
        </div>
      </div>
      <label class="check-field" id="sDayZeroField" title="Other scenes show how long before or after this one they happen, such as 2 days before or 3 months after.">
        <input type="checkbox" id="sDayZero"> Day 0 scene
      </label>
      <label class="check-field" title="A chapter runs until the next scene that starts one. Once any scene does, the first scene opens chapter 1.">
        <input type="checkbox" id="sChapterBreak"> <span id="sChapterLabel">Starts a chapter</span>
      </label>
      <div class="row">
        <span class="hint" id="sWords"></span>
        <button class="small" id="sWrite" title="Open this scene's prose in the editor">Write prose</button>
      </div>
      <div class="row" style="margin-top:16px">
        <button id="sEarlier">Move earlier</button>
        <button id="sLater">Move later</button>
      </div>
      <div class="row">
        <button id="sDuplicate">Duplicate</button>
        <button class="danger" id="sDelete">Delete scene</button>
      </div>
    </div>

    <div id="characterInspector">
      <div class="insp-head">
        <span class="num">CHARACTER</span>
        <span class="ttl" id="cHeading"></span>
        <button class="icon" id="cClose" title="Close">×</button>
      </div>
      <label class="field-label" for="cName">Name</label>
      <input id="cName">
      <label class="field-label" for="cRole">Role</label>
      <input id="cRole" placeholder="Protagonist, mentor, antagonist…">
      <label class="field-label" for="cGender">Gender</label>
      <input id="cGender" placeholder="Woman, man, nonbinary…">
      <label class="field-label" for="cGoal">Goal</label>
      <textarea id="cGoal" rows="2" placeholder="What they want, and what stands in the way."></textarea>
      <label class="field-label" for="cNotes">Notes</label>
      <textarea id="cNotes" rows="6" placeholder="Appearance, voice, backstory, arc."></textarea>
      <div class="hint" id="cPovCount"></div>
      <div class="hint" id="cAppearCount" title="As POV, or named in the title, summary or prose"></div>
      <label class="field-label" for="relTarget">Relationships</label>
      <div id="relList"></div>
      <div class="rel-row" id="relAdd">
        <select id="relTarget" aria-label="Related character"></select>
        <input id="relLabel" placeholder="mentor, sister…" aria-label="How they relate">
        <button class="small" id="relAddBtn">Add</button>
      </div>
      <div class="row" style="margin-top:16px">
        <button id="cUp">Move up</button>
        <button id="cDown">Move down</button>
      </div>
      <div class="row">
        <button class="danger" id="cDelete">Delete character</button>
      </div>
    </div>

    <div id="locationInspector">
      <div class="insp-head">
        <span class="num">LOCATION</span>
        <span class="ttl" id="lHeading"></span>
        <button class="icon" id="lClose" title="Close">×</button>
      </div>
      <label class="field-label" for="lName">Name</label>
      <input id="lName">
      <label class="field-label" for="lNotes">Notes</label>
      <textarea id="lNotes" rows="8" placeholder="Look, sound, smell, history, who goes there."></textarea>
      <div class="hint" id="lCount"></div>
      <div class="row" style="margin-top:16px">
        <button id="lUp">Move up</button>
        <button id="lDown">Move down</button>
      </div>
      <div class="row">
        <button class="danger" id="lDelete">Delete location</button>
      </div>
    </div>
  </aside>
</main>

<div id="modalHost" hidden></div>

<script>
"use strict";

const BOARD_KEY = "storysquish.board";
const LEGACY_BOARD_KEYS = ["manuscriptBoard.v1"];
const SETTINGS_KEY = "storysquish.settings";
const STATUSES = ["Outline", "Draft", "Revision", "Final", "Archived"];
const ACTS = ["Act I", "Act II", "Act III"];
const DEFAULT_TITLE = "Untitled Novel";
const NONE_LABEL = "— none —";
const SAVE_DEBOUNCE_MS = 400;
const FILE_POLL_MS = 2000;
const BACKUP_INTERVAL_MS = 30 * 60 * 1000;
const BACKUPS_KEPT = 30;
const BACKUP_NUDGE_AFTER_MS = 7 * 24 * 60 * 60 * 1000;
const FILE_KEY = "storysquish.file";
const TOKEN_KEY = "storysquish.github-token";
const GITHUB_API = "https://api.github.com";
const GITHUB_BOARD_FILE = "storysquish-board.json";
const GITHUB_BACKUP_INTERVAL_MS = 5 * 60 * 1000;
const GITHUB_CHECK_MS = 30 * 1000;
const GITHUB_SUGGEST_DELAY_MS = 400;
const GITHUB_REVISIONS_LISTED = 30;
const GITHUB_REPO_NAME_PREFIX = "storysquish-";
const GITHUB_UNTITLED_REPO_NAME = "storysquish-board";
const GITHUB_MAX_REPO_NAME_LEN = 80;
const GITHUB_MAX_REPO_NAME_ATTEMPTS = 20;
const DB_NAME = "storysquish";
const FILE_ACCESS = "showOpenFilePicker" in window;
const UNDO_LIMIT = 100;
const SUMMARY_PREVIEW_CHARS = 180;
const IS_MAC = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);

const SHORTCUT_LABELS = IS_MAC
  ? {newScene: "⌘N", undo: "⌘Z", redo: "⇧⌘Z", duplicate: "⌘D",
     earlier: "⌥←", later: "⌥→", up: "⌥↑", down: "⌥↓"}
  : {newScene: "Ctrl+N", undo: "Ctrl+Z", redo: "Ctrl+Shift+Z", duplicate: "Ctrl+D",
     earlier: "Alt+Left", later: "Alt+Right", up: "Alt+Up", down: "Alt+Down"};

// surfaces: board, header, header text, ink, muted, card
// chrome: line, sidebar, inspector, accent, danger, act badge
// statuses: badge fills in STATUSES order
const COLOR_SCHEMES = [
  ["parchment", "Parchment", false,
    ["#c9b79c","#3a2c1e","#f4ead6","#2b2118","#7a6a52","#fdfaf2"],
    ["#d8cdb6","#f2ecdd","#faf6ec","#8a5a2b","#b04030","#cfe0e8"],
    ["#cfe0e8","#e8dcc0","#f3e0c0","#d5ecd0","#e2e2e2"]],
  ["linen", "Linen", false,
    ["#d6d3cc","#33363b","#f1efe9","#24262a","#6b6e74","#ffffff"],
    ["#d9d6cf","#efede8","#f7f6f2","#3f6e8c","#b3413a","#dbe6ee"],
    ["#dbe6ee","#ece4d2","#f2dfc8","#d8ead6","#e4e4e4"]],
  ["sage", "Sage", false,
