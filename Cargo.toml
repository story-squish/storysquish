[package]
name = "storysquish"
version = "0.2.2"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
directories = "6.0.0"
eframe = "0.37.0"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
spellbook = "0.4.2"
ureq = { version = "3.5.2", features = ["json"] }
uuid = { version = "1.29.3", features = ["v4"] }

[dev-dependencies]
egui = "0.37.0"
egui_kittest = { version = "0.37.0", features = ["eframe"] }
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"

# Parsing a Hunspell dictionary unoptimized takes seconds, not milliseconds.
[profile.dev.package.spellbook]
opt-level = 3
