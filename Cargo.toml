[package]
name = "storysquish"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
directories = "6.0.0"
eframe = "0.37.0"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.29.3", features = ["v4"] }

[dev-dependencies]
egui = "0.37.0"
egui_kittest = { version = "0.37.0", features = ["eframe"] }
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
