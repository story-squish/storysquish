name: Release packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach the packages to
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  verify-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.cargo.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Check Cargo.toml version matches tag
        id: cargo
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Cargo.toml version $version does not match tag $TAG"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  macos:
    needs: verify-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Build universal binary
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p target/universal
          lipo -create -output target/universal/storysquish \
            target/aarch64-apple-darwin/release/storysquish \
            target/x86_64-apple-darwin/release/storysquish
          strip target/universal/storysquish

      - name: Assemble app bundle
        run: make app APP_DIR=dist RELEASE_BIN=target/universal/storysquish

      - name: Import signing certificates
        env:
          CERTIFICATES_P12: ${{ secrets.MACOS_CERTIFICATES_P12 }}
          CERTIFICATES_PASSWORD: ${{ secrets.MACOS_CERTIFICATES_PASSWORD }}
        run: |
          : "${CERTIFICATES_P12:?MACOS_CERTIFICATES_P12 secret is not set}"
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -base64 32)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          base64 --decode <<<"$CERTIFICATES_P12" > "$RUNNER_TEMP/certificates.p12"
          security import "$RUNNER_TEMP/certificates.p12" -k "$keychain" \
            -P "$CERTIFICATES_PASSWORD" -T /usr/bin/codesign -T /usr/bin/pkgbuild
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')

          identity() {
            security find-identity -v "$keychain" |
              sed -n "s/.*\"\($1: .*\)\"/\1/p" | head -n1 | grep .
          }
          app_identity=$(identity 'Developer ID Application')
          installer_identity=$(identity 'Developer ID Installer')
          {
            echo "KEYCHAIN=$keychain"
            echo "APP_IDENTITY=$app_identity"
            echo "INSTALLER_IDENTITY=$installer_identity"
          } >> "$GITHUB_ENV"

      - name: Sign app bundle
        run: |
          codesign --force --options runtime --timestamp \
            --keychain "$KEYCHAIN" --sign "$APP_IDENTITY" dist/StorySquish.app
          codesign --verify --strict --verbose=2 dist/StorySquish.app

      - name: Build installer package
        run: |
          pkgbuild --analyze --root dist component.plist
          # A relocatable bundle makes Installer "upgrade" any StorySquish.app it
          # finds elsewhere on disk instead of installing into /Applications.
          plutil -replace 0.BundleIsRelocatable -bool NO component.plist
          pkgbuild \
            --root dist \
            --component-plist component.plist \
            --install-location /Applications \
            --identifier io.github.storysquish \
            --version "${{ needs.verify-version.outputs.version }}" \
            --sign "$INSTALLER_IDENTITY" \
            --keychain "$KEYCHAIN" \
            --timestamp \
            "StorySquish-${TAG}-macos-universal.pkg"

      - name: Notarise and staple installer package
        env:
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          : "${API_KEY_P8:?APPLE_API_KEY_P8 secret is not set}"
          pkg="StorySquish-${TAG}-macos-universal.pkg"
          key="$RUNNER_TEMP/notary-key.p8"
          printf '%s\n' "$API_KEY_P8" > "$key"
          notary=(--key "$key" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID")

          xcrun notarytool submit "$pkg" "${notary[@]}" --wait \
            --output-format json > notary.json
          # notarytool can exit 0 even when Apple rejects the submission.
          if [ "$(plutil -extract status raw notary.json)" != Accepted ]; then
            cat notary.json
            xcrun notarytool log "$(plutil -extract id raw notary.json)" "${notary[@]}"
            exit 1
          fi

          xcrun stapler staple "$pkg"
          spctl --assess --type install --verbose=2 "$pkg"

      - name: Attach package to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "StorySquish-${TAG}-macos-universal.pkg" --clobber

  windows:
    needs: verify-version
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      # Static CRT so the exe runs without the Visual C++ Redistributable.
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Package zip
        shell: pwsh
        run: |
          $dir = "StorySquish-$env:TAG-windows-x86_64"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/storysquish.exe "$dir/StorySquish.exe"
          Copy-Item README.md $dir
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"

      - name: Attach zip to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "StorySquish-${TAG}-windows-x86_64.zip" --clobber
